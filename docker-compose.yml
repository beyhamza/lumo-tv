# ==============================================================================
# Lumo TV — local development stack (docs/architecture.md §7).
#
# Brings up PostgreSQL 16 and lumo-api. The web application and both Android
# applications run natively and point at this API:
#   - web / desktop browser -> http://localhost:8080
#   - Android emulator      -> http://10.0.2.2:8080   (the host, seen from the VM)
#
# Media never goes through this stack. The player opens the user's stream
# directly against the user's own IPTV server.
#
#   cp apps/api/.env.example apps/api/.env     (then fill in the two secrets)
#   docker compose --env-file apps/api/.env up -d
#   docker compose --env-file apps/api/.env logs -f lumo-api
#
# The stack reads apps/api/.env rather than a root .env: the backend and the
# database it owns are configured in one place, next to the application they
# belong to. --env-file is required because compose only auto-loads a root .env.
#
# Database state lives in ./docker-data/postgres (gitignored). Starting over is
# `docker compose down && rm -rf docker-data` - and POSTGRES_PASSWORD is only
# read on the very first boot, so changing it in .env afterwards changes
# nothing until that directory is gone.
#
# `depends_on: condition: service_healthy` is what makes `up` deterministic:
# lumo-api is not started until Postgres actually answers queries. Without it,
# Liquibase races the database on a cold start and the API dies on first boot.
# ==============================================================================

name: lumo-tv

services:

  # ---------------------------------------------------------------- database --
  postgres:
    image: postgres:16-alpine
    container_name: lumo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumo}
      POSTGRES_USER: ${POSTGRES_USER:-lumo}
      # Dev-only default. Production credentials never live in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumo}
      # Deterministic collation: index ordering must not depend on the host
      # locale, or a developer's machine and CI disagree on sort order.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # The cluster lives one level BELOW the mount point. initdb insists on
      # owning its data directory and chmod'ing it to 0700, and the mount root
      # is created by the container runtime rather than by Postgres: on the
      # hosts where taking ownership of that root is refused (Windows and macOS
      # file sharing, NFS), a subdirectory Postgres creates itself is the
      # difference between a cluster that initialises and one that never does.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Exposed so psql, a JDBC client or a test suite can reach it from the host.
      #
      # 15432 on the host, not 5432: a developer with several projects has
      # several Postgres containers, and the default port is the one they all
      # collide on. The container side stays 5432 — that is the port Postgres
      # actually listens on, and the one the API uses over the compose network.
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      # A directory in the repository, not a Docker-managed volume: `ls
      # docker-data/` shows what state exists, `rm -rf docker-data/` is the
      # whole reset procedure, and a fresh clone starts empty instead of
      # silently reattaching to a cluster initialised months ago with a
      # password that is no longer in .env. docker-data/ is gitignored and
      # excluded from the API build context.
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      # -U/-d are required: without them pg_isready checks the *root* user and
      # reports ready before the application database exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumo} -d ${POSTGRES_DB:-lumo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First boot runs initdb; do not start counting failures until it is done.
      start_period: 30s
    networks:
      - lumo

  # ------------------------------------------------------------------- api ----
  lumo-api:
    build:
      # Root context, not ./apps/api: the image build generates the server
      # interfaces from packages/contracts/openapi.yaml (ADR 0001), which a
      # context rooted at apps/api could not see.
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lumo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # `postgres` is the service name on the compose network, not localhost:
      # inside a container, localhost is the container itself.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lumo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lumo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lumo}

      # ADR 0005. The ingestion layer is I/O-bound and written in blocking style.
      SPRING_THREADS_VIRTUAL_ENABLED: "true"

      # Liquibase owns the schema (ADR 0006). There is no ORM to disable:
      # persistence is JdbcClient over hand-written SQL.
      SPRING_LIQUIBASE_ENABLED: "true"

      # Secrets, from the root .env. No default: the API must refuse to boot
      # rather than run on a well-known key.
      LUMO_JWT_SECRET: ${LUMO_JWT_SECRET:?set LUMO_JWT_SECRET in .env}
      LUMO_ENCRYPTION_MASTER_KEY: ${LUMO_ENCRYPTION_MASTER_KEY:?set LUMO_ENCRYPTION_MASTER_KEY in .env}

      LUMO_WEB_BASE_URL: ${LUMO_WEB_BASE_URL:-http://localhost:3000}
      # Whether a source may point INSIDE this server's own network. FALSE, and
      # it stays false anywhere real: without it, POST /sources fetches whatever
      # URL a user supplies from this server's network position and reports back
      # what it found. Turned on only to qualify against the bench below, when
      # the bench is reached at the machine's address on the local network.
      LUMO_INGEST_ALLOW_PRIVATE_HOSTS: ${LUMO_INGEST_ALLOW_PRIVATE_HOSTS:-false}

      LUMO_CORS_ALLOWED_ORIGINS: ${LUMO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Actuator: health only. Nothing else is exposed, in any environment.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when_authorized
    ports:
      - "${LUMO_API_PORT:-8080}:8080"
    healthcheck:
      # Actuator liveness. curl must be present in the API image: apps/api/Dockerfile
      # is required to install it (or to switch this probe to whatever it does ship).
      # Do not reach for /dev/tcp here - CMD-SHELL runs /bin/sh, and on a Debian
      # base that is dash, which has no /dev/tcp. The probe would never pass and the
      # container would sit "starting" until it was killed.
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      # Boot plus Liquibase on a cold database takes a while; do not flap.
      start_period: 90s
    networks:
      - lumo


  # ------------------------------------------------------------------ bench ---
  #
  # The source test bench (S2-03), off by default.
  #
  #   docker compose --profile bench --env-file apps/api/.env up -d
  #
  # It exists for one reason: without it the qualification of US-06 and US-07 is
  # not executable. There is no way to provoke a refused credential, an empty
  # playlist or an oversized response by typing a real address — and no way to
  # do it twice the same way. The paths are in apps/web/e2e/bench/nginx.conf.
  #
  # Behind a profile because it is qualification tooling, not part of the
  # product: `docker compose up -d` on an ordinary day starts Postgres and the
  # API and nothing else. The end-to-end suite names the service explicitly,
  # which enables the profile on its own.
  #
  # QUALIFYING FROM A REAL PHONE. The phone types an address; the API fetches it;
  # the player then opens the stream URLs the playlist names. Those are two
  # different journeys and they need the same host to be reachable from two
  # different places, so:
  #
  #   BENCH_PUBLIC_URL=http://192.168.1.20:18081 \
  #     docker compose --profile bench --env-file apps/api/.env up -d
  #
  # with your machine's address on the local network. Leave it unset and the
  # playlist names localhost, which on a phone is the phone.
  #
  # And the API refuses a private address by default — PrivateAddressGuard, and
  # it must keep refusing in production, where a source pointing inside our own
  # network is a way to map it. A run against a bench on the local network needs
  # LUMO_INGEST_ALLOW_PRIVATE_HOSTS=true, above, and nowhere else.
  bench:
    image: nginx:1.27-alpine
    container_name: lumo-bench
    profiles: ["bench"]
    restart: unless-stopped
    environment:
      BENCH_PUBLIC_URL: ${BENCH_PUBLIC_URL:-http://localhost:18081}
    # The document root is built before nginx answers anything: the playlist is
    # a template, and the oversized payload is generated rather than committed.
    command: ["/bin/sh", "/bench/entrypoint.sh"]
    ports:
      # Fixed, not parameterised. The playlist names this port in the URLs it
      # hands the player, so a port that moves is a playlist that lies.
      - "18081:80"
    volumes:
      - ./apps/web/e2e/bench/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/e2e/bench/entrypoint.sh:/bench/entrypoint.sh:ro
      - ./apps/web/e2e/bench/fixtures:/bench/fixtures:ro
    healthcheck:
      # Healthy means GENERATED, which is the whole reason this probe exists:
      # `up --wait` would otherwise return while the oversized payload was still
      # being written, and the first test to ask for it would get a 404.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/oversized.m3u"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - lumo

networks:
  lumo:
    name: lumo
    driver: bridge
