openapi: 3.0.3

# ==============================================================================
# Lumo TV — public API contract.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH (AGENTS.md §3, ADR 0001).
# It is hand-written. Server and client types are GENERATED from it, never the
# other way round. Any change here impacts all three applications and must be
# announced explicitly in the pull request description.
#
# Naming: payload properties use the exact entity field names of
# docs/domain-model.md §2 (snake_case, no case variants, no synonyms).
# Query parameters use the exact spelling of docs/domain-model.md §3.
#
# Two invariants enforced by this document:
#   1. The Xtream password NEVER appears in a response schema — anywhere.
#   2. A channel's stream_url is NEVER part of a listing. It is emitted only by
#      GET /channels/{id}/playback, per request, after an ownership check.
# ==============================================================================

info:
  title: Lumo TV API
  version: 0.1.0
  description: |
    Backend for the Lumo TV IPTV player (`lumo-api`).

    Lumo hosts, provides and resells **no content**. The user brings their own
    source — an M3U playlist or an Xtream Codes account. This API manipulates
    metadata only: catalogue, guide, favourites, playback progress, access
    rights. **Media never transits through this infrastructure**: the player
    opens the stream directly against the user's own IPTV server.

    ## Authentication

    All operations require `Authorization: Bearer <access_token>` unless the
    operation declares `security: []`. Access tokens are short-lived JWTs
    (15 minutes). Refresh tokens are opaque, rotated on every use, and bound to
    a `device`. Presenting an already-consumed refresh token revokes the whole
    token chain for that device — that is the theft-detection mechanism.

    ## Errors

    Every error response is RFC 7807 `application/problem+json` and carries a
    stable, machine-readable `code`. Clients switch on `code` and render their
    own localised message (FR/EN). `detail` is meant for logs and is never
    displayed raw to a user.

    ## Enumerations

    **Any enumeration in this document may gain a value within v1.** A client
    must treat an unrecognised value as "something I do not handle yet" and
    degrade to a neutral rendering — never crash, never assume the list it was
    generated against is closed. Generators make this easy to get wrong: an
    exhaustive `when` over a Kotlin enum compiles today and throws on the first
    response carrying a value added next month.

    Values are only ever **added**. Removing or renaming one is a breaking
    change and needs a new major version.

    ## Asynchronous ingestion

    Parsing is always server-side. `POST /sources` performs a fast synchronous
    reachability and credential check, then returns `202` with the source in
    `PENDING`; the full catalogue ingestion runs in the background. Clients poll
    `GET /sources/{id}` until `status` reaches `READY` or `ERROR`. A source never
    blocks an HTTP request.
  contact:
    name: Lumo TV
    url: https://lumo.tv
  license:
    name: Proprietary — All rights reserved
    url: https://lumo.tv/legal/license

servers:
  - url: http://localhost:8080/v1
    description: Local development (docker-compose)
  - url: http://10.0.2.2:8080/v1
    description: Local development, as seen from the Android emulator
  - url: https://api.lumo.tv/v1
    description: Production

tags:
  - name: auth
    description: Registration, sign-in, token rotation, TV device activation.
  - name: account
    description: The authenticated user, their entitlement and their devices.
  - name: sources
    description: User-owned M3U playlists and Xtream Codes accounts.
  - name: catalog
    description: Categories, channels, playback URLs and programme guide.
  - name: userdata
    description: Favourites, favourite groups and playback progress.
  - name: billing
    description: |
      Opening a Stripe session. Nothing here grants access: the entitlement is
      written by the Stripe webhook and read from `GET /me/entitlement`
      (ADR 0003).

security:
  - bearerAuth: []

# ==============================================================================
# PATHS
# ==============================================================================

paths:

  # ---------------------------------------------------------------- auth ------

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with an email and a password
      description: |
        Creates the account, provisions the calling `device`, issues a session
        and sends a verification email. The user is signed in immediately.

        Responses for an already-registered email are constant-time with respect
        to an unknown email: the implementation must not leak account existence
        through response latency (US-01).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; the caller is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: |
            An account already exists for this email (`EMAIL_ALREADY_REGISTERED`).
            The client invites the user to sign in or reset their password.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The password does not meet the strength requirement (`PASSWORD_TOO_WEAK`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with an email and a password
      description: |
        On failure the response is deliberately generic (`INVALID_CREDENTIALS`)
        and must not reveal whether the email exists. After five consecutive
        failures a progressive delay applies and `429` is returned (US-02).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid credentials (`INVALID_CREDENTIALS`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/DeviceLimitReached' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Exchange a refresh token for a new token pair
      description: |
        Rotation: the presented refresh token is revoked and a new one is issued.

        Presenting a token that was already consumed returns `401` with
        `REFRESH_TOKEN_REUSED` and revokes **the entire token chain for that
        device** — the device must sign in again.

        Clients must serialise refresh calls (one in flight at a time). Two
        parallel refreshes at start-up revoke each other and sign the user out;
        this is the classic failure of this pattern (US-04).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new token pair. The previous refresh token is now revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            The refresh token is unknown, expired or revoked
            (`REFRESH_TOKEN_INVALID`), or was already consumed
            (`REFRESH_TOKEN_REUSED`, which revokes the device's whole chain).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current device's token chain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out. The refresh chain for that device is revoked.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/oauth/google:
    post:
      tags: [auth]
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for a Lumo session
      description: |
        The server verifies the `id_token` itself — signature, `aud`, `iss`,
        `exp`. It never trusts an email supplied by the client.

        If an account already exists for the verified email, the Google identity
        is **attached to that account**. A duplicate account is never created
        (US-03).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Signed in. The account was created or linked as needed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The Google ID token failed verification (`OAUTH_TOKEN_INVALID`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/DeviceLimitReached' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify-email:
    get:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address from the link sent by email
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Single-use verification token from the email link.
          schema:
            type: string
            minLength: 16
            maxLength: 512
      responses:
        '204':
          description: Email verified. `email_verified_at` is now set.
        '400':
          description: The token is malformed or unknown (`VERIFICATION_TOKEN_INVALID`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: The token has expired (`VERIFICATION_TOKEN_EXPIRED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Always answers `202`, whether or not the email is registered. Account
        enumeration through this endpoint is not possible.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: If the email is registered, a reset message has been sent.
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password from a reset token
      description: Succeeding revokes every refresh token of the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed. All sessions of the account are revoked.
        '400':
          description: The token is malformed or unknown (`RESET_TOKEN_INVALID`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: The token has expired (`RESET_TOKEN_EXPIRED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The new password does not meet the strength requirement (`PASSWORD_TOO_WEAK`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/device/code:
    post:
      tags: [auth]
      operationId: requestDeviceCode
      summary: 'TV activation: request a user code (RFC 8628)'
      description: |
        Called by the television. Returns a short `user_code` to display, and a
        `device_code` the TV keeps private and polls with.

        Typing an email and a password on a remote control is a punitive
        experience and the first abandonment point of a TV application; this flow
        exists to avoid it entirely.

        Properties on this endpoint and on `/auth/device/token` keep their
        RFC 8628 names verbatim.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '201':
          description: A pending authorization was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/device/approve:
    post:
      tags: [auth]
      operationId: approveDeviceCode
      summary: 'TV activation: approve a user code from an authenticated session'
      description: |
        Called from `lumo.tv/activate` by an already signed-in user. Binds the
        pending authorization to the caller's account.

        Strictly rate-limited: `user_code` is short and guessable by design, so
        this endpoint is the one an attacker would brute-force. After five
        attempts the caller is throttled (US-05).

        The response describes the television that was just linked, so the
        confirmation screen can name it — "*Living room TV* is now connected to
        your account". This is the only moment in the flow where the user can
        check they activated the *right* set; a generic acknowledgement after
        typing a code read across a room is how a doubt becomes a support
        ticket.

        It is a `DeviceApproval` and **not** a `Device`, because no device
        exists yet: the `device` row is provisioned when the television's next
        poll of `/auth/device/token` succeeds. Approving a set that is then
        switched off must not leave a phantom installation in the account —
        counted against the quota, listed as an appliance that never once
        connected.

        This is also where the device quota is checked, rather than on the
        television's poll. The user is *here*, holding a phone, able to read
        "you have reached the device limit of your plan" and act on it; the
        television can only display an opaque failure. The quota is enforced
        again when the device is actually provisioned — approval and poll are
        minutes apart and the account can change in between — and a refusal
        there reaches the television as the RFC's own `ACCESS_DENIED`, leaving
        the polling contract untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveDeviceRequest'
      responses:
        '200':
          description: |
            Approved. The television's next poll receives a session, and the set
            it identified itself as is returned for the confirmation screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceApproval'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No pending authorization carries this code (`DEVICE_CODE_NOT_FOUND`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            Either the code was already approved, denied or consumed
            (`DEVICE_CODE_ALREADY_USED`), or linking this television would
            exceed the plan's device quota (`DEVICE_LIMIT_REACHED`). The two are
            different conversations: the first says "read the new code off the
            screen", the second says "remove a device or upgrade".
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: The code has expired (`DEVICE_CODE_EXPIRED`). The TV displays a new one on its own.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/device/token:
    post:
      tags: [auth]
      operationId: pollDeviceToken
      summary: 'TV activation: poll for the session (RFC 8628)'
      description: |
        The television polls at the `interval` returned by
        `POST /auth/device/code`.

        While the authorization is still pending the response is `400` with
        `code: AUTHORIZATION_PENDING` — this is the nominal case, not a failure,
        and must not be surfaced as an error. On `SLOW_DOWN` the client
        increases its interval by 5 seconds, per RFC 8628, and keeps polling.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Approved. The `device_code` is now consumed and cannot be reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: |
            RFC 8628 polling states, carried in `code`:

            | `code` | Meaning | TV behaviour |
            |---|---|---|
            | `AUTHORIZATION_PENDING` | Not approved yet | Keep polling at `interval` |
            | `SLOW_DOWN` | Polling too fast | Add 5 s to `interval`, keep polling |
            | `ACCESS_DENIED` | The user refused | Stop, show a message |
            | `EXPIRED_TOKEN` | The code expired | Request a new code silently |
            | `DEVICE_CODE_NOT_FOUND` | Unknown `device_code` | Request a new code |
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------- account ------

  /me:
    get:
      tags: [account]
      operationId: getCurrentUser
      summary: The authenticated user
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [account]
      operationId: updateCurrentUser
      summary: Update display name and locale
      description: |
        Only `display_name` and `locale` are mutable here. Email changes require
        re-verification and are not part of v1. Omitted properties are left
        unchanged; an explicit `null` clears `display_name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/entitlement:
    get:
      tags: [account]
      operationId: getEntitlement
      summary: The user's access rights
      description: |
        **The only source of truth for access rights** (ADR 0003).

        A client never asks a store whether the user is premium. Both Android
        listings and the web read this single endpoint. In v1 the table is fed by
        Stripe webhooks; in v2 Play RTDN will write into the same table, with no
        client-side change.

        A user with no subscription has a `FREE` / `ACTIVE` entitlement; this
        endpoint never returns `404`.
      responses:
        '200':
          description: The user's single active entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices:
    get:
      tags: [account]
      operationId: listDevices
      summary: Devices linked to the account
      responses:
        '200':
          description: The account's devices, most recently seen first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices/{id}:
    delete:
      tags: [account]
      operationId: revokeDevice
      summary: Unlink a device and revoke its tokens
      description: |
        Revokes the device's entire refresh-token chain. That device is signed
        out at its next call. Removing the calling device is allowed and is
        equivalent to signing out.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Device unlinked and its tokens revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such device on this account (`DEVICE_NOT_FOUND`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------- sources ------

  /sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: The user's sources
      responses:
        '200':
          description: Every source owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [sources]
      operationId: createSource
      summary: Register a source, then ingest it asynchronously
      description: |
        Two distinct error surfaces, deliberately:

        1. **Synchronous validation** — reachability and credentials are checked
           before answering, within a bounded timeout. A failure here is a `422`
           carrying an `IngestionErrorCode` and **no source is created**. This is
           what makes "your credentials were refused by the server" appear while
           the user is still looking at the form (US-06).
        2. **Asynchronous ingestion** — once validation passes the response is
           `202` with `status: PENDING`. Catalogue parsing runs in the
           background. A failure there is *not* an HTTP error: the source moves
           to `status: ERROR` and carries the reason in `error_code`, which the
           client reads while polling `GET /sources/{id}`.

        An Xtream `host` is normalised server-side: with or without a scheme,
        with or without a port, with or without a trailing slash. Tolerate and
        normalise rather than reject.

        `kind: M3U_FILE` cannot be created through this JSON endpoint — see the
        note on `SourceKind`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '202':
          description: |
            Validated and accepted. Ingestion runs in the background; the source
            is returned in `PENDING`. Poll `GET /sources/{id}` until `READY` or
            `ERROR`.
          headers:
            Location:
              description: URL of the created source.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            The plan's source quota is already used up (`SOURCE_LIMIT_REACHED`).
            No source was created and nothing was validated: the check happens
            before the user's own server is contacted.

            The client reads the quota from `Entitlement.max_sources` and should
            not have offered the form — this response is the backstop, not the
            nominal path.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IngestionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sources/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [sources]
      operationId: getSource
      summary: One source, with its current ingestion status
      description: |
        The endpoint clients poll after `POST /sources` or
        `POST /sources/{id}/sync`. `status` and `error_code` carry the outcome of
        the background ingestion.
      responses:
        '200':
          description: The source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
    patch:
      tags: [sources]
      operationId: updateSource
      summary: Update a source
      description: |
        Omitted properties are left unchanged. Changing any property that affects
        ingestion (`host`, `username`, `password`, `m3u_url`, `epg_url`) moves the
        source back to `PENDING` and triggers a fresh ingestion.

        `password` is write-only. It is re-encrypted with AES-256-GCM and is
        never echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: The updated source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '422': { $ref: '#/components/responses/IngestionFailed' }
    delete:
      tags: [sources]
      operationId: deleteSource
      summary: Delete a source and everything ingested from it
      description: |
        Irreversible, and it takes everything that belongs to the source with
        it: categories, channels, EPG programmes, films, series with their
        seasons and episodes, favourites, recently watched channels and playback
        progress. Nothing belonging to another source is touched.

        Adding the same source again does not bring any of it back: ids are
        minted at ingestion, so the favourites and positions that pointed at
        the old ones have nothing left to point at.

        For another device, the proof that a source is gone is `404
        SOURCE_NOT_FOUND` on a call that names it, or its absence from a
        successful `GET /sources`. A network failure proves nothing.
      responses:
        '204':
          description: Source and its ingested data deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }

  /sources/{id}/sync:
    post:
      tags: [sources]
      operationId: syncSource
      summary: Force a re-synchronisation
      description: |
        Starts an ingestion the user asked for. The catalogue ingested before
        stays readable while it runs, and if it fails.

        Refusals are checked in this order: `404`, then `409` when one is
        already running, then `429`. Only requests to this operation count
        towards the `429`: the server's own automatic refresh does not, and
        neither does the ingestion that follows a `PATCH` of the credentials —
        correcting a password must never make anyone wait.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '202':
          description: Accepted. The source is returned in `SYNCING`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409':
          description: A synchronisation is already running for this source (`SOURCE_SYNC_IN_PROGRESS`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            Too many manual synchronisations (`SOURCE_SYNC_RATE_LIMITED`).

            This limit protects the *user's own* IPTV server: hammering a
            third-party panel gets their account throttled or banned. It is a
            product safeguard, not a capacity one (ADR 0005).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------- catalog ------

  /sources/{id}/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Categories of a source
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: contentType
          in: query
          required: false
          description: Restrict to one content type. Omitted, every category is returned.
          schema:
            $ref: '#/components/schemas/ContentType'
      responses:
        '200':
          description: Categories ordered by `position`, each with its channel count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/SourceNotReady' }

  /sources/{id}/channels:
    get:
      tags: [catalog]
      operationId: listChannels
      summary: Channels of a source, paginated
      description: |
        **No `stream_url` is present in this response.** A list of a thousand
        channels does not carry a thousand stream URLs. Playback URLs are
        obtained one at a time from `GET /channels/{id}/playback`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: categoryId
          in: query
          required: false
          description: Restrict to one category.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Free-text search on the channel name, typo-tolerant (trigram).
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: ids
          in: query
          required: false
          style: form
          explode: true
          description: |
            Resolve these channels, and only these. Repeatable:
            `?ids=…&ids=…`.

            **What it is for.** `Favorite` and `RecentChannel` carry identifiers
            and nothing else, deliberately — a name copied onto them would be a
            name the next ingestion has already changed. A client with a local
            catalogue resolves those identifiers against it; a client without one
            has no way to turn a favourite into a row a person can read. This
            parameter is that way, and it is why the two schemas can stay as they
            are.

            **Semantics.** Composes with `categoryId` and `q` — every filter
            present narrows the same result. The order is unchanged (category,
            then `position`): the caller already holds the order it wants, and a
            rail sorted by *its* rule is the caller's job, not the query's.
            `total_elements` counts the matches, so a client can tell how many of
            the identifiers it sent still exist.

            **Unknown identifiers are absent, not an error.** A channel dropped by
            the last re-synchronisation, or one belonging to another source or
            another account, is simply not in the answer. A 404 here would turn a
            stale favourite into a broken screen, and would let a caller probe for
            channel ids that are not theirs.

            Bounded at 100, which is a lookup for a rail and not a bulk export of
            the catalogue: the paginated form above is how a catalogue is read.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of channels, ordered by category then `position`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/SourceNotReady' }

  /sources/{id}/vod:
    get:
      tags: [catalog]
      operationId: listVod
      summary: Films of a source, paginated
      description: |
        The same shape as `GET /sources/{id}/channels`, down to the parameter
        names, and that is the point: a client reuses the pagination, the search
        and the identifier lookup it already wrote instead of growing a second
        set that drifts from the first.

        **No `stream_url` here either**, for the reason given on the channel
        listing: a page of films does not carry a page of credential-bearing
        URLs. Playback URLs come from `GET /vod/{id}/playback`, one at a time.

        **No `plot` here.** It is loaded when somebody opens a film, not when
        they scroll past it — see `VodItem.plot`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: categoryId
          in: query
          required: false
          description: Restrict to one category. Its `content_type` is `VOD`.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: |
            Free-text search on the title. Case-insensitive substring, as on the
            channel listing — the trigram index makes it fast, not approximate.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: ids
          in: query
          required: false
          style: form
          explode: true
          description: |
            Resolve these films, and only these. Repeatable, bounded at 100, and
            it composes with the other filters — the same semantics as `ids` on
            the channel listing, including that unknown identifiers are absent
            from the answer rather than an error.

            **Send `size` with it.** The default page is 50, so a hundred
            identifiers asked for without it come back half answered, with a
            `200` and nothing to say the rest was dropped.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of films, ordered by category then `position`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VodItemPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/SourceNotReady' }

  /channels/{id}/playback:
    get:
      tags: [catalog]
      operationId: getChannelPlayback
      summary: Obtain the stream URL for one channel, on demand
      description: |
        **The only operation in this API that emits a `stream_url`.**

        Deliberately separated from the listing: the URL is issued at the moment
        of playback, after verifying that the channel belongs to a source owned
        by the caller. It is never logged, never cached in a shared store, and
        never handed to anyone but its owner.

        The player opens this URL directly against the user's IPTV server. The
        media does not transit through Lumo.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Playback details for this channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such channel, or it does not belong to a source owned by the
            caller (`CHANNEL_NOT_FOUND`). Non-ownership is reported as `404`,
            not `403`, so the endpoint cannot be used to probe for channel ids.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            The source cannot serve playback right now:

            - `SOURCE_NOT_READY` — an ingestion is pending or running, or none
              has ever succeeded. A source in `ERROR` that still holds a
              previous catalogue **does** play: a provider that was down at the
              hour of the automatic refresh must not cost the user their
              evening;
            - `SOURCE_AUTH_FAILED` — the last ingestion failed because the
              provider refused the credentials. The stream would be refused
              too, and the useful message is that one;
            - `SOURCE_EXPIRED` — the user's Xtream account has expired, as
              reported by the panel or by the last ingestion;
            - `SOURCE_MAX_CONNECTIONS` — the subscription's simultaneous-stream
              limit is reached. The client explains that the *user's own*
              subscription caps concurrent streams (US-09).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /channels/{id}/epg:
    get:
      tags: [catalog]
      operationId: getChannelEpg
      summary: Programme guide for one channel over a time range
      description: |
        Programmes are matched on the channel's `tvg_id` within its source.
        Retention is a sliding window from D-1 to D+3; a range outside it returns
        an empty list rather than an error.

        A channel with no `tvg_id`, or a source with no EPG URL, returns an empty
        list.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: from
          in: query
          required: false
          description: Inclusive lower bound. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound. Defaults to `from` + 24 h. At most 4 days after `from`.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Programmes overlapping the range, ordered by `starts_at`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpgProgrammeList'
        '400':
          description: |
            The range is invalid — `to` before `from`, or wider than four days
            (`VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such channel on a source owned by the caller (`CHANNEL_NOT_FOUND`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vod/{id}:
    get:
      tags: [catalog]
      operationId: getVodItem
      summary: One film, with its synopsis
      description: |
        The only operation that returns a populated `plot`, and the reason the
        listing does not.

        **A film's synopsis costs a call to the user's own server.** On an Xtream
        panel it comes from `get_vod_info`, which takes one identifier and answers
        for one film. Fetching it for a catalogue of thirty thousand at every
        synchronisation is not slow — it is the kind of traffic that gets our
        address banned by somebody's provider. So it is fetched when a person
        opens a film, and cached from then on.

        **The consequences a client should plan for.** A film opened before is
        instant. A film never opened costs one round trip, which is why the
        listing already carries the poster, the title and the year: a detail
        screen has everything it needs to draw immediately, and only the synopsis
        arrives late.

        **A panel that refuses is not an error here.** The film is returned with
        whatever is already known and `plot` null. The synopsis is a comfort; the
        film is the product, and the playback operation does not depend on this
        one.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The film. `plot` is null when the source could not supply one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VodItem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such film on a source owned by the caller (`VOD_ITEM_NOT_FOUND`),
            reported as `404` and not `403` for the reason given on the playback
            operation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vod/{id}/playback:
    get:
      tags: [catalog]
      operationId: getVodPlayback
      summary: Obtain the stream URL for one film, on demand
      description: |
        The twin of `GET /channels/{id}/playback`, and everything written there
        applies here unchanged: the URL is issued at the moment of playback,
        after checking that the film belongs to a source owned by the caller; it
        is never logged, never cached in a shared store, never handed to anyone
        but its owner; and the player opens it directly against the user's own
        server, so the media does not transit through Lumo.

        Two operations rather than one because they address two id spaces — a
        film is not a channel and the identifier could not be resolved without
        being told which of the two it is.

        **A film's URL is built, a channel's is stored.** For an Xtream source
        the panel gives an identifier and a container extension, and this
        endpoint assembles `/movie/{user}/{pass}/{id}.{ext}`; an M3U playlist
        carries the whole URL already (`adr/0009`). The client sees neither
        difference.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Playback details for this film.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VodPlaybackInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such film, or it does not belong to a source owned by the caller
            (`VOD_ITEM_NOT_FOUND`). Non-ownership is a `404` and not a `403`, so
            the endpoint cannot be used to probe for identifiers.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            The source cannot serve playback right now — `SOURCE_NOT_READY`,
            `SOURCE_AUTH_FAILED`, `SOURCE_EXPIRED`, `SOURCE_MAX_CONNECTIONS`.
            The same four as for a channel, and they mean the same things: a
            subscription's simultaneous-stream limit counts a film exactly as it
            counts a channel.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ userdata ------

  /sources/{id}/series:
    get:
      tags: [catalog]
      operationId: listSeries
      summary: Series of a source, paginated
      description: |
        The same shape as `GET /sources/{id}/channels` and `GET /sources/{id}/vod`,
        down to the parameter names. A client reuses the pagination, the search
        and the identifier lookup it already wrote.

        **Flat, and that is the whole point of separating it from the tree.** This
        answers from what the synchronisation stored — `get_series` on an Xtream
        panel, one call for the whole catalogue. Seasons and episodes are not here
        and must not be: fetching them would mean one call to the user's own server
        *per series*, and a panel with eight hundred series turns a synchronisation
        into eight hundred requests against somebody's provider. That is
        `GET /series/{id}`, on demand.

        **No `plot` here**, for the reason it is absent from the film listing.

        **An M3U source always answers an empty page.** Series are an Xtream
        feature (`adr/0010`):
        a playlist declares no season and no episode, and this API does not
        reconstruct a tree from titles. The empty page is the honest answer, and
        the client explains the absence on the source's own page rather than as an
        empty tab.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: categoryId
          in: query
          required: false
          description: Restrict to one category. Its `content_type` is `SERIES`.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: |
            Free-text search on the title. Case-insensitive substring, as on the
            other two listings.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: ids
          in: query
          required: false
          style: form
          explode: true
          description: |
            Resolve these series, and only these. Repeatable, bounded at 100, same
            semantics as `ids` everywhere else — unknown identifiers are absent
            from the answer rather than an error.

            **Send `size` with it.** The default page is 50, so a hundred
            identifiers asked for without it come back half answered, with a `200`
            and nothing to say the rest was dropped.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of series, ordered by category then `position`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/SourceNotReady' }

  /sources/{id}/episodes:
    get:
      tags: [catalog]
      operationId: resolveEpisodes
      summary: Resolve episodes by identifier
      description: |
        **A resolver, not a listing, and `ids` is required.**

        It exists for one caller: a "continue watching" rail. `GET /me/progress`
        returns identifiers and positions — not titles, not posters, and not the
        series an episode belongs to. Something has to turn those rows back into
        something a screen can draw, and this is it, in one request rather than one
        per row.

        That lesson was learnt the expensive way. Sprint 5 shipped the film resume
        rail and only then discovered that a saved position could not be resolved
        back to a film; the fix was to settle what `item_ref` holds
        (`SaveProgressRequest.item_ref`). This operation is the same problem, seen
        before it cost a sprint.

        **`ids` is required on purpose.** Without it this would be a listing over
        every episode of every series of a source — tens of thousands of rows
        nobody has a use for, and a page of them is not a screen anybody would
        build. A resolver that can only resolve cannot be misused as a crawler.

        Each `Episode` carries its `series_id`, which is what lets a rail group
        rows by series and then resolve those with `GET /sources/{id}/series?ids=`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: ids
          in: query
          required: true
          style: form
          explode: true
          description: |
            The episodes to resolve. Repeatable, bounded at 100, unknown
            identifiers absent from the answer rather than an error.

            **Send `size` with it**, for the reason repeated on every `ids`
            parameter in this document.
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: |
            The episodes that exist and belong to a source owned by the caller.
            Order is not guaranteed to match `ids`: the caller holds the order it
            wants, and re-sorting here would be guessing which one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/SourceNotReady' }

  /series/{id}:
    get:
      tags: [catalog]
      operationId: getSeries
      summary: One series, with its seasons and episodes
      description: |
        The tree, and **the only operation in this API that can be slow on its
        first call**.

        On an Xtream panel the whole tree comes from `get_series_info`, which takes
        one series identifier and answers with every season and every episode. It
        is one call to the *user's own server*, made when somebody opens a series,
        and cached afterwards.

        **The cache expires, unlike a film's synopsis.** A film's plot never
        changes; a series in production gains an episode a week. So this cache has
        a validity period — short and uniform, a few hours — rather than a clever
        one. Nothing in the data distinguishes a series that ended in 2011 from one
        airing tonight, and a rule that pretended otherwise would be wrong in the
        direction nobody notices: a viewer who cannot see the episode that came out
        this morning.

        <h3>What a client must plan for</h3>

        A series opened before answers from the cache, immediately. A series never
        opened costs a round trip to somebody's provider, which can take seconds
        and can fail — which is why the listing already carries the poster, the
        title and the year. A detail screen draws from what it has and fills the
        tree in when it arrives.

        <h3>The failure that must not be collapsed</h3>

        `404` means **this series does not exist**, and it is final. `503` means
        **the panel did not answer**, and it is worth retrying.

        A client that showed "series not found" on a network fault would send
        somebody looking for a series their provider still has. These are two
        different sentences and the codes keep them apart:
        `SERIES_NOT_FOUND` against `SOURCE_UNREACHABLE`.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: |
            The series and its tree. `plot` is null when the source supplied none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such series on a source owned by the caller (`SERIES_NOT_FOUND`),
            reported as `404` and not `403` so the endpoint cannot be used to
            probe for identifiers.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            The user's panel could not be reached or refused
            (`SOURCE_UNREACHABLE`, `SOURCE_AUTH_FAILED`, `SOURCE_EXPIRED`), and
            no cached tree is available to serve instead.

            **Distinct from `404` by design.** The series exists; what failed is
            the call that fills in its seasons. Retrying is the right advice, and
            a client that said "not found" here would give the wrong one.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /episodes/{id}/playback:
    get:
      tags: [catalog]
      operationId: getEpisodePlayback
      summary: Obtain the stream URL for one episode, on demand
      description: |
        The third of the family, and everything written on
        `GET /channels/{id}/playback` and `GET /vod/{id}/playback` applies here
        unchanged: issued at the moment of playback after checking ownership, never
        logged, never cached in a shared store, and opened by the player directly
        against the user's own server.

        A third operation rather than a shared one for the reason there are already
        two: three id spaces, and an identifier that could not be resolved without
        being told which one it belongs to.

        **An episode's URL is built like a film's**, from the panel's identifier
        and container extension: `/series/{user}/{pass}/{id}.{ext}`. The path
        segment differs from a film's `/movie/`, and that is the only difference a
        client never sees.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Playback details for this episode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodePlaybackInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such episode, or it does not belong to a source owned by the caller
            (`EPISODE_NOT_FOUND`). A `404` and not a `403`, so the endpoint
            cannot be used to probe for identifiers.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            The source cannot serve playback right now — `SOURCE_NOT_READY`,
            `SOURCE_AUTH_FAILED`, `SOURCE_EXPIRED`, `SOURCE_MAX_CONNECTIONS`.
            The same four as for a channel and a film, meaning the same things:
            an episode counts against a subscription's simultaneous-stream
            ceiling exactly as they do.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/favorites:
    get:
      tags: [userdata]
      operationId: listFavorites
      summary: The user's favourites
      parameters:
        - name: groupId
          in: query
          required: false
          description: Restrict to one favourite group.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Favourites ordered by group then `position`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [userdata]
      operationId: addFavorite
      summary: Add a channel to a favourite group
      description: |
        `group_id` may be omitted: the channel then lands in the account's
        default group, which is created on the first add.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFavoriteRequest'
      responses:
        '201':
          description: The created favourite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            The channel or the group does not belong to the caller
            (`CHANNEL_NOT_FOUND`, `FAVORITE_GROUP_NOT_FOUND`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: This channel is already in that group (`FAVORITE_ALREADY_EXISTS`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/favorites/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    patch:
      tags: [userdata]
      operationId: updateFavorite
      summary: Move a favourite, or change its place in its group
      description: |
        Omitted properties are left unchanged.

        **Why this exists rather than a remove-then-add.** That pair loses the
        favourite's `position`, and a connection dropped between the two calls
        loses the favourite itself. Moving is one operation because it is one
        intention.

        `position` is the index the favourite takes **within its target group**,
        counted from zero. The favourites it displaces shift down; a value past
        the end of the group appends. Positions in a group are always
        contiguous — a client never has to reason about gaps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFavoriteRequest'
      responses:
        '200':
          description: The moved favourite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such favourite on this account, or the target group does not
            belong to the caller (`FAVORITE_NOT_FOUND`,
            `FAVORITE_GROUP_NOT_FOUND`).

            A group belonging to somebody else answers `404` and not `403`: a
            `403` would confirm that the group exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            The channel is already in the target group
            (`FAVORITE_ALREADY_EXISTS`). Same rule as `POST /me/favorites`: one
            channel appears at most once per group.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [userdata]
      operationId: removeFavorite
      summary: Remove a favourite
      responses:
        '204':
          description: Favourite removed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such favourite on this account (`FAVORITE_NOT_FOUND`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/favorite-groups:
    get:
      tags: [userdata]
      operationId: listFavoriteGroups
      summary: The user's favourite groups
      responses:
        '200':
          description: Groups ordered by `position`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteGroupList'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [userdata]
      operationId: createFavoriteGroup
      summary: Create a favourite group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFavoriteGroupRequest'
      responses:
        '201':
          description: The created group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteGroup'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A group with this name already exists (`FAVORITE_GROUP_ALREADY_EXISTS`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/favorite-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    patch:
      tags: [userdata]
      operationId: updateFavoriteGroup
      summary: Rename a favourite group, or move it in the list
      description: |
        Omitted properties are left unchanged.

        The default group can be renamed like any other. Renaming it does not
        clear `is_default`: it stays the group `POST /me/favorites` falls back
        to, and the group `DELETE` empties others into.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFavoriteGroupRequest'
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteGroup'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such group on this account (`FAVORITE_GROUP_NOT_FOUND`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Another group already carries this name (`FAVORITE_GROUP_ALREADY_EXISTS`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [userdata]
      operationId: deleteFavoriteGroup
      summary: Delete a favourite group, keeping its favourites
      description: |
        **The favourites are not deleted.** They move to the account's default
        group, appended in their current order, in the same transaction that
        removes the group.

        Deleting a shelf and throwing away the books are two different actions,
        and nothing on screen distinguishes them — so the destructive reading is
        not the one this operation takes. A client still tells the user what is
        about to happen, with the count.

        The default group itself cannot be deleted: it is where the others empty
        into, and removing it would move favourites to a group that has just
        ceased to exist.
      responses:
        '204':
          description: Group deleted; its favourites are now in the default group.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such group on this account (`FAVORITE_GROUP_NOT_FOUND`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            This is the default group and it cannot be deleted
            (`FAVORITE_GROUP_NOT_DELETABLE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/progress:
    get:
      tags: [userdata]
      operationId: listProgress
      summary: Playback positions saved by this account
      description: |
        Ordered by `updated_at`, most recent first — which is also the order a
        "Continue watching" rail wants.

        Without this operation `PUT /me/progress` writes into a void: progress
        could be saved on the phone and never read back on the television, and
        "resume across screens" would be a promise no client could keep.

        Passing `sourceId`, `itemType` and `itemRef` together narrows the page to
        the single matching row, which is how a player looks up one item before
        opening it. All three, because the key is all three: `item_ref` is opaque
        and nothing here constrains what a client puts in it.

        There is deliberately no `/me/progress/{itemType}/{itemRef}` variant:
        `item_ref` is opaque and nothing stops it containing a slash or a percent
        sign. Filtering keeps it in a query parameter, where encoding is
        unambiguous, instead of a path segment, where it is not.
      parameters:
        - name: sourceId
          in: query
          required: false
          description: Restrict to one source. Part of an item's key, not a convenience.
          schema:
            type: string
            format: uuid
        - name: itemType
          in: query
          required: false
          description: Restrict to one kind of item.
          schema:
            $ref: '#/components/schemas/ProgressItemType'
        - name: itemRef
          in: query
          required: false
          description: |
            Restrict to one item. Combined with `itemType` this yields at most
            one element.
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of saved positions, most recently updated first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackProgressPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [userdata]
      operationId: saveProgress
      summary: Save playback progress for a VOD item or an episode
      description: |
        Idempotent upsert keyed on `(source_id, item_type, item_ref)` for the
        caller. The source is part of the key rather than a passenger — see
        `SaveProgressRequest.source_id`.

        Live channels have no progress. `ProgressItemType` has no `LIVE` value,
        and sending one for a channel is a client bug rather than a supported
        case: a position means nothing on a continuous stream. What a channel
        gets instead is `PUT /me/recent-channels`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProgressRequest'
      responses:
        '200':
          description: The stored progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackProgress'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SourceNotFound' }

  /me/recent-channels:
    get:
      tags: [userdata]
      operationId: listRecentChannels
      summary: Live channels the user watched recently
      description: |
        The television's first rail, and the reason it is worth anything: it
        knows what was watched on the phone.

        Deliberately **not** part of `playback_progress`. A playback position
        means nothing on a continuous stream, and folding live channels into
        that table would make `position_ms` a required property with no possible
        value. Two concepts sharing storage because they render in the same rail
        is the shortcut that bills six months later.

        Ordered most recent first, and bounded: this feeds a rail, not a
        history. The server keeps a rolling window per account and prunes
        silently.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum entries to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: The most recently watched channels, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentChannelList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [userdata]
      operationId: recordRecentChannel
      summary: Record that a channel was just watched
      description: |
        Idempotent upsert keyed on the channel for the caller: watching the same
        channel again moves it to the top rather than adding a row.

        Sent when playback actually starts, not when a channel is focused — a
        rail built from what the D-pad passed over on its way somewhere is
        noise, and it is the user's own history being made worse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRecentChannelRequest'
      responses:
        '200':
          description: The recorded entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentChannel'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such channel on this account (`CHANNEL_NOT_FOUND`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------- billing ------

  /billing/checkout-session:
    post:
      tags: [billing]
      operationId: createCheckoutSession
      summary: Open a Stripe Checkout session for the paid plan
      description: |
        Returns a URL to redirect to. **Nothing is granted here.** The
        entitlement changes only when Stripe's webhook writes it, and clients
        keep reading `GET /me/entitlement` afterwards (ADR 0003) — a client that
        assumes premium because the redirect succeeded will be wrong for every
        abandoned checkout.

        **The success and cancel URLs are not accepted from the client.** They
        are built server-side from configuration. A caller-supplied return URL
        is an open redirect wearing a billing costume, and this project already
        guards the same hole on the sign-in `next` parameter. The optional
        `locale` is the only thing the caller gets to influence, and it only
        picks the language Stripe renders in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
      responses:
        '200':
          description: A Checkout session was created. Redirect the user to `url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            The account already holds an active paid entitlement
            (`ALREADY_SUBSCRIBED`). The client sends the user to the portal
            instead of opening a second subscription.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /billing/portal-session:
    post:
      tags: [billing]
      operationId: createPortalSession
      summary: Open the Stripe customer portal
      description: |
        Changing a payment method, downloading an invoice, cancelling — the
        portal covers all three. That is the whole reason it is here: none of
        those screens has to exist in Lumo, in three applications, in two
        languages.

        Return URL built server-side, for the reason given on
        `POST /billing/checkout-session`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortalSessionRequest'
      responses:
        '200':
          description: A portal session was created. Redirect the user to `url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            This account has never been billed, so it has no customer record to
            open a portal on (`BILLING_CUSTOMER_NOT_FOUND`). A `FREE` user who
            never subscribed is the ordinary case; the client offers checkout,
            not the portal.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived access token (15 minutes) obtained from `/auth/login`,
        `/auth/register`, `/auth/oauth/google`, `/auth/refresh` or
        `/auth/device/token`.

  # ---------------------------------------------------------- parameters ------

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size. Capped server-side so a large catalogue cannot be pulled in one call.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        format: int32
        minimum: 1

  # ----------------------------------------------------- shared responses -----

  responses:
    BadRequest:
      description: The request is malformed or fails validation (`VALIDATION_FAILED`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: |
        Missing, malformed or expired access token (`UNAUTHENTICATED`,
        `ACCESS_TOKEN_EXPIRED`). On `ACCESS_TOKEN_EXPIRED` the client refreshes
        once and replays the request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded (`RATE_LIMITED`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DeviceLimitReached:
      description: |
        Signing in here would link one device too many for the plan
        (`DEVICE_LIMIT_REACHED`). No session is issued.

        The client's way out is to name the limit and offer both exits: unlink a
        device from another screen, or upgrade. It reads the ceiling from
        `Entitlement.max_devices` — never from a constant of its own
        (AGENTS.md §1).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SourceNotFound:
      description: No such source on this account (`SOURCE_NOT_FOUND`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SourceNotReady:
      description: |
        No catalogue has been ingested from this source yet
        (`SOURCE_NOT_READY`): `Source.last_synced_at` is null. The client keeps
        polling `GET /sources/{id}`.

        This is about the *first* ingestion only. Once one has succeeded the
        catalogue stays readable whatever `status` says — during a
        re-synchronisation and after a failed one — because ingestion updates
        rows in place and never empties them. What is served then is the
        previous catalogue, and `status`, `last_synced_at` and `last_error_at`
        are what the client uses to say how old it may be.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IngestionFailed:
      description: |
        Synchronous validation of the source failed. `code` is one of the
        `IngestionErrorCode` values and is what the client translates into an
        actionable message.

        This is the number-one friction point of onboarding. "Something went
        wrong" loses users here; "your credentials were refused by the server"
        recovers them.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # -------------------------------------------------------------- schemas -----

  schemas:

    # ---- errors ------------------------------------------------------------

    Problem:
      type: object
      description: |
        RFC 7807 problem detail. Every error response in this API uses this
        shape with `Content-Type: application/problem+json`.

        Clients switch on `code`, never on `title` or `detail`. `detail` is
        written for logs and support, is not localised, and is never displayed
        raw to a user.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem type.
          example: https://lumo.tv/errors/source-auth-failed
        title:
          type: string
          description: Short, human-readable, English, non-localised summary.
          example: Source authentication failed
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code, repeated for convenience.
          example: 422
        code:
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          description: |
            Stable machine-readable code. **This is the only field a client is
            allowed to branch on.** Clients must handle an unrecognised value
            gracefully rather than crash: new codes may be added within v1.
        detail:
          type: string
          nullable: true
          description: |
            Diagnostic explanation for logs and support. Never rendered raw in
            the UI. Never contains a stream URL, an Xtream password or a token.
          example: Connection timed out after 10s
        instance:
          type: string
          format: uri-reference
          nullable: true
          description: Path of the request that produced this problem.
          example: /v1/sources
        errors:
          type: array
          nullable: true
          description: Per-field details, present on validation failures only.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      description: One field-level validation failure.
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON pointer to the offending property, relative to the request body.
          example: /password
        code:
          type: string
          description: Stable machine-readable reason.
          example: TOO_SHORT
        detail:
          type: string
          nullable: true
          description: Diagnostic explanation. Not localised, not for display.

    IngestionErrorCode:
      type: string
      description: |
        **Complete enumeration of ingestion error codes for v1.**

        These are the values that reach a user during onboarding, whether
        synchronously in a `422` `Problem.code` or asynchronously in
        `Source.error_code`. Each one must have an actionable FR and EN message
        in every client — the whole point of this enumeration is that no client
        ever falls back to a generic failure message here.

        | Value | Cause | What the user should be told |
        |---|---|---|
        | `SOURCE_UNREACHABLE` | The host did not answer, DNS failed, or the request timed out. | The server could not be reached. Offer "Try again". Must read as clearly different from a credential refusal. |
        | `SOURCE_AUTH_FAILED` | The panel rejected `username`/`password`. | The credentials were refused by the server. Keep the host in the form so only what is wrong is retyped. |
        | `SOURCE_EXPIRED` | The Xtream account itself has expired. | The subscription with the provider has expired; Lumo cannot renew it. |
        | `SOURCE_MAX_CONNECTIONS` | The panel reports the simultaneous-connection limit reached. | The subscription limits simultaneous streams; close another stream. |
        | `SOURCE_INVALID_FORMAT` | The response is not a valid M3U playlist, XMLTV guide or Xtream payload. | The URL does not return a playlist. Explain what a correct M3U URL looks like. |
        | `SOURCE_EMPTY` | Parsing succeeded but yielded zero channels. | The playlist is empty. Never show a success screen over an empty list. |
        | `SOURCE_TOO_LARGE` | The payload exceeds the ingestion size ceiling. | The playlist is too large to import. |
      enum:
        - SOURCE_UNREACHABLE
        - SOURCE_AUTH_FAILED
        - SOURCE_EXPIRED
        - SOURCE_MAX_CONNECTIONS
        - SOURCE_INVALID_FORMAT
        - SOURCE_EMPTY
        - SOURCE_TOO_LARGE

    ErrorCode:
      type: string
      description: |
        Every stable error code this API emits, ingestion codes included.

        Grouped by concern:

        - **Generic** — `VALIDATION_FAILED`, `UNAUTHENTICATED`,
          `ACCESS_TOKEN_EXPIRED`, `FORBIDDEN`, `NOT_FOUND`, `CONFLICT`,
          `RATE_LIMITED`, `INTERNAL_ERROR`.
        - **Account and sign-in** — `EMAIL_ALREADY_REGISTERED`,
          `INVALID_CREDENTIALS`, `PASSWORD_TOO_WEAK`, `OAUTH_TOKEN_INVALID`,
          `VERIFICATION_TOKEN_INVALID`, `VERIFICATION_TOKEN_EXPIRED`,
          `RESET_TOKEN_INVALID`, `RESET_TOKEN_EXPIRED`.
        - **Sessions** — `REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_REUSED`,
          `DEVICE_NOT_FOUND`.
        - **TV activation (RFC 8628)** — `AUTHORIZATION_PENDING`, `SLOW_DOWN`,
          `ACCESS_DENIED`, `EXPIRED_TOKEN`, `DEVICE_CODE_NOT_FOUND`,
          `DEVICE_CODE_EXPIRED`, `DEVICE_CODE_ALREADY_USED`.
        - **Sources and ingestion** — `SOURCE_NOT_FOUND`, `SOURCE_NOT_READY`,
          `SOURCE_SYNC_IN_PROGRESS`, `SOURCE_SYNC_RATE_LIMITED`, plus every
          `IngestionErrorCode`.
        - **Catalogue and user data** — `CHANNEL_NOT_FOUND`,
          `VOD_ITEM_NOT_FOUND`, `SERIES_NOT_FOUND`, `EPISODE_NOT_FOUND`,
          `FAVORITE_NOT_FOUND`, `FAVORITE_ALREADY_EXISTS`,
          `FAVORITE_GROUP_NOT_FOUND`, `FAVORITE_GROUP_ALREADY_EXISTS`,
          `FAVORITE_GROUP_NOT_DELETABLE`.

          The last one is only ever the default group. It is separate from a
          bare `CONFLICT` for the same reason as the quota codes below: a client
          that cannot tell "this one in particular cannot go" from "something
          clashed" has nothing useful to say to the person holding the remote.
        - **Plan limits and billing** — `SOURCE_LIMIT_REACHED`,
          `DEVICE_LIMIT_REACHED`, `ALREADY_SUBSCRIBED`,
          `BILLING_CUSTOMER_NOT_FOUND`.

          The first two exist so that hitting a quota is never reported as a
          bare `CONFLICT`. A client that cannot tell "you already have this" from
          "your plan stops here" cannot offer the one thing that resolves the
          second: removing something, or upgrading.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - ACCESS_TOKEN_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
        - EMAIL_ALREADY_REGISTERED
        - INVALID_CREDENTIALS
        - PASSWORD_TOO_WEAK
        - OAUTH_TOKEN_INVALID
        - VERIFICATION_TOKEN_INVALID
        - VERIFICATION_TOKEN_EXPIRED
        - RESET_TOKEN_INVALID
        - RESET_TOKEN_EXPIRED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - DEVICE_NOT_FOUND
        - AUTHORIZATION_PENDING
        - SLOW_DOWN
        - ACCESS_DENIED
        - EXPIRED_TOKEN
        - DEVICE_CODE_NOT_FOUND
        - DEVICE_CODE_EXPIRED
        - DEVICE_CODE_ALREADY_USED
        - SOURCE_NOT_FOUND
        - SOURCE_NOT_READY
        - SOURCE_SYNC_IN_PROGRESS
        - SOURCE_SYNC_RATE_LIMITED
        - SOURCE_UNREACHABLE
        - SOURCE_AUTH_FAILED
        - SOURCE_EXPIRED
        - SOURCE_MAX_CONNECTIONS
        - SOURCE_INVALID_FORMAT
        - SOURCE_EMPTY
        - SOURCE_TOO_LARGE
        - CHANNEL_NOT_FOUND
        - VOD_ITEM_NOT_FOUND
        - SERIES_NOT_FOUND
        - EPISODE_NOT_FOUND
        - FAVORITE_NOT_FOUND
        - FAVORITE_ALREADY_EXISTS
        - FAVORITE_GROUP_NOT_FOUND
        - FAVORITE_GROUP_ALREADY_EXISTS
        - FAVORITE_GROUP_NOT_DELETABLE
        - SOURCE_LIMIT_REACHED
        - DEVICE_LIMIT_REACHED
        - ALREADY_SUBSCRIBED
        - BILLING_CUSTOMER_NOT_FOUND

    # ---- enums -------------------------------------------------------------

    Locale:
      type: string
      description: UI language. FR and EN are supported from the first screen.
      enum: [fr, en]

    Platform:
      type: string
      description: The kind of installation a `device` represents.
      enum: [ANDROID_MOBILE, ANDROID_TV, WEB]

    SourceKind:
      type: string
      description: |
        What the user registered.

        `M3U_FILE` designates a playlist uploaded as a file. It exists in the
        domain model and may be returned by read operations, but v1 exposes no
        endpoint that creates one: `POST /sources` is JSON-only and accepts
        `M3U_URL` and `XTREAM`. A multipart upload operation is not part of this
        contract.
      enum: [M3U_URL, M3U_FILE, XTREAM]
      x-enum-varnames: [M3U_URL, M3U_FILE, XTREAM]

    SourceStatus:
      type: string
      description: |
        Ingestion lifecycle.

        `PENDING` → accepted, not started. `SYNCING` → ingestion running.
        `READY` → catalogue usable. `ERROR` → ingestion failed, see `error_code`.

        Clients poll until `READY` or `ERROR`; those are the only terminal states.

        The status describes the **latest attempt**, not whether there is a
        catalogue. That is `last_synced_at`: once non-null, the catalogue
        listings answer in every status. Reading a catalogue and playing from it
        are two different permissions — playback is refused while an ingestion
        is pending or running, and allowed again after a failed one unless the
        failure is about the user's credentials or subscription (see the `409`
        of the playback operations).
      enum: [PENDING, SYNCING, READY, ERROR]

    SyncStep:
      type: string
      description: |
        Where a running ingestion has got to.

        `SourceStatus` says whether ingestion is running; this says how far it
        is. Onboarding waits here — a large playlist takes up to a minute — and
        a minute of silence is where a user concludes it is broken and closes
        the application. A named step says two things an indeterminate spinner
        cannot: that it is moving, and how far it got when it fails.

        | Value | Cause |
        |---|---|
        | `CONNECTING` | Opening the connection to the user's server. |
        | `AUTHENTICATED` | Credentials accepted; nothing parsed yet. |
        | `PARSING_CHANNELS` | Reading the live channels. |
        | `PARSING_VOD` | Reading the film catalogue, when the source has one. |
        | `PARSING_SERIES` | Reading the series list, on an Xtream source. |
        | `FETCHING_EPG` | Retrieving the XMLTV guide, when the source has one. |

        These are the server's real phases and must stay so. A step the
        implementation does not actually distinguish is a reassuring fiction,
        and three true steps beat four invented ones.

        `PARSING_VOD` earns its place by that rule rather than in spite of it: a
        film catalogue is commonly three times the size of the channel list, so
        an ingestion that stayed on `PARSING_CHANNELS` throughout would leave the
        waiting screen still and silent for the longest minute of the import —
        which is where somebody decides the application is broken and closes it.

        `PARSING_SERIES` earns it the same way and no more: it is `get_series`,
        one call for the flat list, which on a panel with eight hundred series is
        a real pause. It is **not** the tree — `get_series_info` is per series and
        happens when somebody opens one, long after any ingestion has finished.

        An M3U source never reports it. A playlist declares no series
        (`adr/0010`), so there is no phase to report, and a step shown for a
        source that never runs it would be exactly the reassuring fiction this
        enumeration refuses.
      enum:
        - CONNECTING
        - AUTHENTICATED
        - PARSING_CHANNELS
        - PARSING_VOD
        - PARSING_SERIES
        - FETCHING_EPG

    ContentType:
      type: string
      description: |
        Kind of catalogue a `category` groups.

        All three are now ingested and served, each with its own listing and its
        own playback operation. `SERIES` was the last to arrive; until sprint 6
        the value existed so the schema was complete and nothing produced it.

        An earlier version of this description claimed all three were ingested
        when only `LIVE` was. That was corrected rather than left standing: a
        false sentence in the document that decides what the server does costs
        more than an absent one — and the sentence above is written the day the
        third one became true, not the day it was planned.

        **`SERIES` is only ever produced by an Xtream source** (`adr/0010`). A
        playlist declares no season and no episode, and this API does not
        reconstruct a tree from titles: an M3U entry that looks like an episode
        is classified by `adr/0009` like anything else, and stays a film or a
        channel.

        How an entry becomes `VOD` differs by source, and only one of the two
        cases is a judgement call. An Xtream panel answers it itself, through
        `get_vod_streams` beside `get_live_streams`. An M3U playlist declares
        nothing, so the type is inferred — from the URL alone, and never from
        what the entry is called. The rule, what it costs when it is wrong, and
        which way its doubt falls are `adr/0009`.
      enum: [LIVE, VOD, SERIES]

    Plan:
      type: string
      description: Subscription tier of an `entitlement`.
      enum: [FREE, PREMIUM]

    EntitlementStatus:
      type: string
      description: |
        State of the entitlement. `ACTIVE` and `TRIALING` grant premium
        features; the other three do not.

        `TRIALING` is a separate state rather than a flag on `ACTIVE` because
        the two produce different screens. "Your trial ends in 3 days" is an
        invitation to enter a card; "renews on the 14th" is a reassurance. Told
        apart only by `plan` and `status`, they would be indistinguishable, and
        every client would have to guess from `current_period_end`.
      enum: [ACTIVE, TRIALING, PAST_DUE, CANCELED, EXPIRED]

    EntitlementProvider:
      type: string
      description: |
        What fed the entitlement. `STRIPE` in v1, `PLAY` reserved for v2 RTDN,
        `MANUAL` for support-granted access.
      enum: [STRIPE, PLAY, MANUAL]

    ProgressItemType:
      type: string
      description: |
        What a `playback_progress` row points at. Live channels have no
        progress, so there is no `LIVE` value here.
      enum: [VOD, EPISODE]

    # ---- auth --------------------------------------------------------------

    DeviceRegistration:
      type: object
      description: |
        Identifies the installation opening the session. A `device` row is
        created or refreshed, and the issued refresh token is bound to it — that
        binding is what lets `DELETE /me/devices/{id}` revoke one device without
        touching the others.
      required: [platform]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        name:
          type: string
          nullable: true
          maxLength: 100
          description: User-facing device name.
          example: Living room TV
        model:
          type: string
          nullable: true
          maxLength: 100
          description: Hardware model reported by the OS.
          example: Pixel 8
        app_version:
          type: string
          nullable: true
          maxLength: 40
          description: Version of the installed application.
          example: 1.0.0

    RegisterRequest:
      type: object
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 200
          writeOnly: true
          description: |
            At least 10 characters. Strength is measured by entropy (zxcvbn),
            not by composition rules; clients show the unmet rule before
            submission rather than after (US-01). Hashed with Argon2id.
        display_name:
          type: string
          nullable: true
          maxLength: 100
        locale:
          allOf:
            - $ref: '#/components/schemas/Locale'
          description: Defaults to the `Accept-Language` header, then to `en`.
        device:
          $ref: '#/components/schemas/DeviceRegistration'

    LoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 200
        device:
          $ref: '#/components/schemas/DeviceRegistration'

    GoogleSignInRequest:
      type: object
      required: [id_token, device]
      properties:
        id_token:
          type: string
          format: password
          writeOnly: true
          maxLength: 4096
          description: |
            Google ID token from Credential Manager (Android) or Google Identity
            Services (web). The server verifies signature, `aud`, `iss` and `exp`
            before trusting any claim in it.
        device:
          $ref: '#/components/schemas/DeviceRegistration'

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
          description: |
            The opaque refresh token. Stored hashed server-side; the plaintext
            exists only on the device.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          format: password
          writeOnly: true
          minLength: 16
          maxLength: 512
          description: Single-use token from the reset email. Masked in generated `toString()`.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 200
          writeOnly: true

    TokenPair:
      type: object
      description: |
        A freshly issued access/refresh pair. The refresh token supersedes any
        previously held one for this device.
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
          format: password
          description: |
            Bearer JWT, valid 15 minutes. `format: password` carries no UI meaning
            here: it makes the generators mask this property in `toString()`, so a
            token cannot reach a log line by accident (AGENTS.md §5).
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int32
          description: Lifetime of `access_token`, in seconds.
          example: 900
        refresh_token:
          type: string
          format: password
          description: |
            Opaque token, single-use. Masked in generated `toString()`. Rotated on every `/auth/refresh`.
            Presenting a consumed one revokes the device's entire chain.

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          description: A token pair plus the account it belongs to.
          required: [user, device_id]
          properties:
            user:
              $ref: '#/components/schemas/User'
            device_id:
              type: string
              format: uuid
              description: The `device` this session is bound to.

    DeviceCodeRequest:
      type: object
      description: Sent by the television to start an RFC 8628 authorization.
      required: [platform]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        name:
          type: string
          nullable: true
          maxLength: 100
        model:
          type: string
          nullable: true
          maxLength: 100
        app_version:
          type: string
          nullable: true
          maxLength: 40

    DeviceCodeResponse:
      type: object
      description: |
        RFC 8628 device authorization response. Property names are the RFC's,
        verbatim.
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          type: string
          format: password
          description: |
            Secret held by the television and sent on every poll. Never
            displayed. Stored hashed server-side (`device_authorization.device_code_hash`).
        user_code:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{8}$'
          description: |
            The 8 characters shown on screen and typed on `lumo.tv/activate`.

            Drawn from an alphabet with no ambiguous glyphs: `0`/`O` and
            `1`/`I`/`L` are all excluded, so what is read at three metres is what
            gets typed. Transmitted unformatted; a client may insert a separator
            for display, and the server accepts the code case-insensitively with
            separators and spaces stripped.

            Single-use, valid 10 minutes.
        verification_uri:
          type: string
          format: uri
          description: Page to open on a phone or a computer.
          example: https://lumo.tv/activate
        verification_uri_complete:
          type: string
          format: uri
          description: |
            Same page with the code pre-filled — this is what the QR code on the
            television encodes, so the nominal path involves no typing at all.
          example: https://lumo.tv/activate?code=K7RM4XPQ
        expires_in:
          type: integer
          format: int32
          description: Lifetime of the authorization, in seconds.
          example: 600
        interval:
          type: integer
          format: int32
          description: |
            Minimum seconds between two polls of `/auth/device/token`. Polling
            faster earns `SLOW_DOWN`, after which the client adds 5 seconds.
          example: 5

    ApproveDeviceRequest:
      type: object
      required: [user_code]
      properties:
        user_code:
          type: string
          minLength: 8
          maxLength: 12
          description: |
            The code read off the television screen. Accepted
            case-insensitively; separators and spaces are stripped before
            matching, which is why the accepted length is wider than the 8
            characters actually stored.

    DeviceApproval:
      type: object
      description: |
        The television an approval just bound to the account, as **it declared
        itself** when it requested the code.

        Deliberately not a `Device`: no `device` row exists at this point, and
        inventing one for a set that may never poll would put a phantom
        installation in the user's list and against their quota. The fields are
        the ones `DeviceCodeRequest` carried, echoed back.

        They are client-supplied and unverified, so they are good enough to name
        a set on a confirmation screen and never good enough to be treated as
        identity. Render `name` as a label; do not key anything on it.
      required: [platform]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        name:
          type: string
          nullable: true
          description: User-facing device name, as the television reported it.
          example: Living room TV
        model:
          type: string
          nullable: true
        app_version:
          type: string
          nullable: true

    DeviceTokenRequest:
      type: object
      required: [device_code]
      properties:
        device_code:
          type: string
          format: password
          maxLength: 512
          description: The secret returned by `POST /auth/device/code`. Masked in generated `toString()`.

    # ---- account -----------------------------------------------------------

    User:
      type: object
      description: |
        The account. `password_hash` and `oauth_identity` rows are internal and
        appear in no response.
      required: [id, email, locale, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        locale:
          $ref: '#/components/schemas/Locale'
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the verification link is followed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      description: Omitted properties are left unchanged.
      properties:
        display_name:
          type: string
          nullable: true
          maxLength: 100
          description: An explicit `null` clears it.
        locale:
          $ref: '#/components/schemas/Locale'

    Device:
      type: object
      description: |
        One installation linked to the account.

        `is_current` is computed against the access token presented on the
        request, which is why it is a property of the response and not something
        the caller works out for itself.
      required: [id, platform, is_current, created_at]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/Platform'
        name:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        app_version:
          type: string
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Last request seen from this installation. Nothing announces a
            disconnection, so this is a "last seen", never a presence: a client
            that renders "online" does so from a threshold of its own choosing
            over this value, and says "active" rather than claiming certainty.
        is_current:
          type: boolean
          description: |
            True on the one device whose token made this call.

            This is the row the user must not revoke by accident.
            `DELETE /me/devices/{id}` on your own device is allowed and signs
            you out — a device list that cannot say which one is *this* one asks
            the user to find out by trying.

            False everywhere else, including on the television just linked by
            `POST /auth/device/approve`, which is by definition not the caller.
        created_at:
          type: string
          format: date-time

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    Entitlement:
      type: object
      description: |
        The user's access rights, computed server-side. `provider_ref` is a
        billing-internal reference and is intentionally not exposed.
      required: [plan, status, provider, updated_at]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          $ref: '#/components/schemas/EntitlementStatus'
        provider:
          $ref: '#/components/schemas/EntitlementProvider'
        current_period_end:
          type: string
          format: date-time
          nullable: true
          description: End of the paid period. Null on `FREE`.
        trial_ends_at:
          type: string
          format: date-time
          nullable: true
          description: |
            End of the free trial. Non-null only while `status` is `TRIALING`.
            Distinct from `current_period_end`, which dates the end of a period
            that was *paid for*.
        max_sources:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: |
            Sources this plan allows. **Null means unlimited**, not unknown.

            Present so that a client can disable "add a source" before the user
            fills a form that is going to be refused, and so that the free
            plan's ceiling lives in exactly one place. A client never carries
            its own copy of this number: that would be an access right computed
            client-side, which this project forbids outright (AGENTS.md §1).
            The day the free plan allows two, one row changes here and three
            applications follow without a release.
        max_devices:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: |
            Devices this plan allows. **Null means unlimited**, not unknown.
            Same rule as `max_sources`: read, never assumed.
        updated_at:
          type: string
          format: date-time

    # ---- sources -----------------------------------------------------------

    Source:
      type: object
      description: |
        A registered source.

        **This schema has no password property and never will.** The Xtream
        password is encrypted at rest (AES-256-GCM, data key wrapped by an
        out-of-database master key) and never leaves the `source` layer — not
        even for its owner (`docs/domain-model.md` §2).
      required: [id, label, kind, status, auto_sync]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Name the user gave this source.
        kind:
          $ref: '#/components/schemas/SourceKind'
        host:
          type: string
          nullable: true
          description: |
            Xtream base URL, normalised server-side. Returned so an edit form can
            keep it while the user corrects only what was wrong (US-06).
          example: http://panel.example.org:8080
        username:
          type: string
          nullable: true
          description: Xtream username. The matching password is never returned.
        m3u_url:
          type: string
          nullable: true
          description: Playlist URL, for `M3U_URL` sources.
        epg_url:
          type: string
          nullable: true
          description: Optional XMLTV guide URL, independent of the playlist.
        status:
          $ref: '#/components/schemas/SourceStatus'
        sync_step:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SyncStep'
          description: |
            How far the running ingestion has got. Non-null only while `status`
            is `SYNCING`; cleared when it reaches `READY` or `ERROR`.

            Rendered as a checklist while the user waits (mobile, écran 5). A
            client that ignores it falls back to an indeterminate progress bar,
            which is correct but worse.
        auto_sync:
          type: boolean
          description: |
            Whether the server re-synchronises this source on its own.

            On the source rather than on the account or the device, and that is
            the whole point: re-synchronising is server work that hits the
            user's own IPTV server, so the decision belongs to the source it
            hits. One may want a playlist that moves refreshed nightly and a
            stable subscription left alone. On a device, the setting would have
            to be made three times and would still not describe what the server
            does while every device is asleep.
        error_code:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IngestionErrorCode'
          description: |
            Why the last ingestion failed. Non-null only when `status` is
            `ERROR`. A stable code, never a free-form message — the client owns
            the wording, in FR and EN.
        last_error_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the ingestion that set `error_code` failed. Non-null only when
            `status` is `ERROR`, and cleared by the next success.

            Separate from `last_synced_at` because the two answer different
            questions and a single timestamp cannot answer both: one row of the
            account screen reads "1 248 channels · checked 2 h ago", the row
            below it reads "credentials refused **since yesterday**".

            The age is what makes the message actionable. "Credentials refused"
            alone does not say whether the user missed two hours of television
            or two weeks.
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Last ingestion that **succeeded**. Unchanged by a failed attempt —
            see `last_error_at`.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Expiry of the user's Xtream account, as reported by the panel. Shown
            after a successful registration (US-06). Null for M3U sources.
        max_connections:
          type: integer
          format: int32
          nullable: true
          description: |
            Simultaneous streams the user's subscription allows, as reported by
            the panel. Null when unknown or not applicable.
        channel_count:
          type: integer
          format: int32
          nullable: true
          description: |
            Channels ingested from this source. Derived, not stored on the
            entity. Null until the first successful ingestion — that is, while
            `last_synced_at` is null — and present from then on in every
            status, so a source being refreshed still says how much it holds.
            It is what "we found N channels" is rendered from (US-06, US-07).
        category_count:
          type: integer
          format: int32
          nullable: true
          description: |
            Categories ingested from this source. Derived and nullable on
            exactly the same terms as `channel_count`, with which it is
            displayed side by side on the success screen — "1 248 chaînes ·
            96 catégories". Half of that line was available; this is the other
            half.

    SourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Source'

    CreateSourceRequest:
      type: object
      description: |
        `kind` decides which properties are required:

        | `kind` | Required | Optional |
        |---|---|---|
        | `XTREAM` | `label`, `host`, `username`, `password` | `epg_url` |
        | `M3U_URL` | `label`, `m3u_url` | `epg_url` |

        `M3U_FILE` is not creatable through this operation.

        The combination is validated server-side; a mismatch is `400`
        `VALIDATION_FAILED` with per-field `errors`.
      required: [label, kind]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: '#/components/schemas/SourceKind'
        host:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Xtream base URL. Accepted with or without a scheme, with or without a
            port, with or without a trailing slash — normalised rather than
            rejected (US-06).
        username:
          type: string
          nullable: true
          maxLength: 200
        password:
          type: string
          format: password
          nullable: true
          maxLength: 200
          writeOnly: true
          description: |
            Xtream password. **Write-only, by contract.** Encrypted with
            AES-256-GCM before persistence, never returned by any operation,
            never written to a log at any level including `DEBUG`.
        m3u_url:
          type: string
          nullable: true
          maxLength: 2000
        epg_url:
          type: string
          nullable: true
          maxLength: 2000
          description: Optional XMLTV URL, a separate field from the playlist URL.
        auto_sync:
          type: boolean
          default: true
          description: |
            Whether the server re-synchronises this source on its own. Defaults
            to true: a catalogue that silently goes stale is the failure the
            user cannot diagnose.

    UpdateSourceRequest:
      type: object
      description: |
        Omitted properties are left unchanged. Changing `host`, `username`,
        `password`, `m3u_url` or `epg_url` re-triggers ingestion.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        host:
          type: string
          nullable: true
          maxLength: 500
        username:
          type: string
          nullable: true
          maxLength: 200
        password:
          type: string
          format: password
          nullable: true
          maxLength: 200
          writeOnly: true
          description: Write-only. Re-encrypted on write, never returned.
        m3u_url:
          type: string
          nullable: true
          maxLength: 2000
        epg_url:
          type: string
          nullable: true
          maxLength: 2000
        auto_sync:
          type: boolean
          description: |
            Toggling this does **not** re-trigger an ingestion: it only decides
            whether the server will start one by itself later. It is the one
            property in this request that leaves the catalogue alone.

    # ---- catalog -----------------------------------------------------------

    Category:
      type: object
      description: |
        A grouping of channels within a source. Channels carrying no
        `group-title` in the playlist land in a generated "Unclassified"
        category rather than being dropped.
      required: [id, source_id, name, content_type, position]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        external_id:
          type: string
          nullable: true
          description: |
            Identifier used by the origin panel or playlist.

            One value is assigned by Lumo rather than by the source:
            `m3u:__unclassified__` is the group that collects M3U entries with no
            `group-title` (US-07). It is the only category the server invents, so
            it is the only one whose `name` is not the user's own wording —
            clients render their own translation when they see this identifier
            and fall back to `name` otherwise.
        name:
          type: string
        content_type:
          $ref: '#/components/schemas/ContentType'
        position:
          type: integer
          format: int32
          description: Display order within the source.
        channel_count:
          type: integer
          format: int32
          nullable: true
          description: |
            Items in this category — channels, films or series, according to
            `content_type`. Derived, not stored on the entity. Renders "N" next to
            each category (US-08). The name predates the film and series
            catalogues and is kept: renaming a field is a breaking change for
            three clients, a description is not.

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Channel:
      type: object
      description: |
        A live channel.

        **`stream_url` is deliberately absent.** It is a sensitive value and is
        emitted only by `GET /channels/{id}/playback`, one channel at a time,
        after an ownership check.
      required: [id, source_id, name, position, is_adult]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        external_id:
          type: string
          nullable: true
        name:
          type: string
        logo_url:
          type: string
          nullable: true
          description: |
            Logo advertised by the user's own playlist (`tvg-logo`). Lumo ships
            no bundled logo and no fallback artwork of its own.
        tvg_id:
          type: string
          nullable: true
          description: EPG identifier, used to join with `epg_programme`.
        number:
          type: integer
          format: int32
          nullable: true
          description: |
            The channel number the provider assigns — `tvg-chno` in an M3U, the
            panel's own field in Xtream. Null when the source carries none, and
            many do not.

            **Not `position`.** That is a display index, reassigned at every
            ingestion; this is the number the user knows by heart and types on a
            remote control, and the two diverge the moment a channel drops out
            of the playlist. Without this field, direct number entry — the
            oldest gesture in television — has nothing to work from.
        quality:
          type: string
          nullable: true
          maxLength: 20
          description: |
            Definition as the source advertises it: `HD`, `FHD`, `UHD`, `4K`,
            `H265`… Echoed verbatim, and rendered as a badge next to the name.

            **A free string, deliberately not an enumeration.** Sources write
            what they like, sometimes inside the channel name itself. An
            enumeration would force the server to file the unknown under some
            value, which is to say to lie about it; an unrecognised string is
            merely a badge the client can show or ignore.
        position:
          type: integer
          format: int32
        is_adult:
          type: boolean
          description: Flagged by the source as adult content.

    ChannelPage:
      type: object
      description: One page of channels.
      required: [items, page, size, total_elements, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page.
        size:
          type: integer
          format: int32
          description: Requested page size, after the server-side cap.
        total_elements:
          type: integer
          format: int64
          description: Total channels matching the filters.
        total_pages:
          type: integer
          format: int32

    VodItem:
      type: object
      description: |
        A film.

        **Not a `Channel` with extra columns.** A channel is played; a film is
        *chosen*, and nobody chooses without a poster, a year and a running time.
        Putting those on `Channel` would mean six null columns on the fifteen
        thousand rows of an ordinary channel list.

        **`stream_url` is absent**, for the reason it is absent from `Channel`:
        it is credential-bearing and comes from `GET /vod/{id}/playback`, one
        film at a time, after an ownership check.

        **`container_extension` is absent too, and that one is not about
        secrecy.** It is a fragment the server uses to build an Xtream playback
        URL, it is null for every M3U film (`adr/0009`), and no client has
        anything to do with it. A field that is meaningless to every consumer is
        not a field the contract should carry.
      required: [id, source_id, name, position, is_adult]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        external_id:
          type: string
          nullable: true
          description: Identifier used by the origin panel or playlist.
        name:
          type: string
        poster_url:
          type: string
          nullable: true
          description: |
            Artwork advertised by the user's own source. Lumo ships no bundled
            poster and no fallback of its own; null means a client renders the
            title, never a picture of ours standing in for one of theirs.
        year:
          type: integer
          format: int32
          nullable: true
          description: Release year, when the source states one. Many do not.
        duration_seconds:
          type: integer
          format: int32
          nullable: true
          description: |
            Running time. Null far more often than not — and a client that needs
            it to decide whether something was watched to the end has to cope
            without it (see `PlaybackProgress.duration_ms`).
        rating:
          type: string
          nullable: true
          description: |
            Whatever the source calls a rating, echoed verbatim and never
            reinterpreted — `7.4`, `PG-13` and `★★★★` all occur. A number here
            would mean this layer deciding what the provider meant, which is the
            decision already refused for `Channel.quality`.
        plot:
          type: string
          nullable: true
          description: |
            Synopsis, and **absent from the listing on purpose**: it is fetched
            when somebody opens a film rather than when they scroll past a
            thousand.

            The reason is not response size, it is the user's own server: on an
            Xtream panel the synopsis comes from `get_vod_info`, which is **one
            HTTP call per film**. Loading it for a catalogue of thirty thousand
            at every synchronisation is not slow — it is the kind of thing that
            gets our address banned by somebody's provider.

            So it is null in a page, and populated on the single-film read that
            fills it in.
        position:
          type: integer
          format: int32
          description: Display order within the source.
        is_adult:
          type: boolean
          description: |
            As the source flags it. Exposed and **not acted on**: filtering it is
            a parental control, parental control needs profiles, and profiles are
            v2 (`AGENTS.md` §6).

    VodItemPage:
      type: object
      description: One page of films.
      required: [items, page, size, total_elements, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VodItem'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page.
        size:
          type: integer
          format: int32
          description: Requested page size, after the server-side cap.
        total_elements:
          type: integer
          format: int64
          description: Total films matching the filters.
        total_pages:
          type: integer
          format: int32

    Series:
      type: object
      description: |
        A series, as a listing carries one.

        **A `VodItem` minus one field and plus one.** No `container_extension`,
        because a series is not played — its episodes are. And an
        `episode_run_time`, which is indicative rather than authoritative: it is
        what the panel says a typical episode lasts, not the length of any
        particular one.

        Everything else is a film's, deliberately: `poster_url` nullable, `plot`
        absent from listings and filled by `GET /series/{id}`, `rating` echoed
        verbatim. A client that wrote a film card can draw this one.

        **No season and no episode here.** They cost a call to the user's own
        server, per series — see `GET /sources/{id}/series`.
      required: [id, source_id, name, position, is_adult]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        external_id:
          type: string
          nullable: true
          description: Identifier used by the origin panel.
        name:
          type: string
        poster_url:
          type: string
          nullable: true
          description: |
            Artwork advertised by the user's own source. Lumo ships no bundled
            poster and no fallback of its own; null means a client renders the
            title, never a picture of ours standing in for one of theirs.
        year:
          type: integer
          nullable: true
          description: First-broadcast year, when the source states one.
        episode_run_time:
          type: integer
          nullable: true
          description: |
            Typical episode length in minutes, as the panel states it.

            **Indicative, and never used as a duration.** A saved position needs
            the length of the episode being watched, which is
            `Episode.duration_seconds`; using this in its place would compute
            "finished" against a number that belongs to no episode in particular.
        rating:
          type: string
          nullable: true
          description: |
            Whatever the source calls a rating, echoed verbatim and never
            reinterpreted — the same ruling as `VodItem.rating`.
        plot:
          type: string
          nullable: true
          description: |
            Synopsis, and **absent from the listing on purpose**, exactly as on
            `VodItem`: it arrives with the tree, from the single call that
            `GET /series/{id}` makes.
        position:
          type: integer
          format: int32
          description: Display order within the source.
        is_adult:
          type: boolean
          description: |
            As the source flags it. Exposed and **not acted on**: filtering it is
            a parental control, parental control needs profiles, and profiles are
            v2.

    SeriesPage:
      type: object
      description: One page of series. The envelope of every other listing.
      required: [items, page, size, total_elements, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Series'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page.
        size:
          type: integer
          format: int32
          description: Requested page size, after the server-side cap.
        total_elements:
          type: integer
          format: int64
          description: Total series matching the filters.
        total_pages:
          type: integer
          format: int32

    SeriesDetail:
      type: object
      description: |
        One series and its whole tree, as `GET /series/{id}` returns it.

        A separate schema from `Series` rather than `Series` with a nullable
        `seasons`: a listing never carries the tree and a detail read always does,
        so a shared schema would make every client check for a field that is
        absent by construction in one case and present by construction in the
        other.
      required: [series, seasons]
      properties:
        series:
          $ref: '#/components/schemas/Series'
        seasons:
          type: array
          description: |
            Ordered by `season_number`. **May be empty**, and that is not an
            error: some panels list a series and answer `get_series_info` with
            nothing. A client shows the series with no episodes rather than a
            failure — the series exists, its tree does not.
          items:
            $ref: '#/components/schemas/Season'

    Season:
      type: object
      description: |
        A season, which is an intercalary level and not an object anybody opens
        for itself.

        Hence the four fields and no more: a number, a count, artwork when the
        panel has some, and the episodes. There is no `GET /seasons/{id}` and
        there should not be — a season is reached through its series and has no
        life of its own.
      required: [season_number, episodes]
      properties:
        season_number:
          type: integer
          format: int32
          minimum: 0
          description: |
            As the panel numbers it. **Zero occurs** and means specials on many
            panels; it is passed through rather than renamed, because deciding it
            means "specials" would be this layer interpreting a provider's
            convention.
        episode_count:
          type: integer
          format: int32
          nullable: true
          description: |
            How many episodes the panel claims this season has.

            **It can disagree with `episodes`, and the list wins.** A panel that
            announces twenty-four and returns twenty-two has twenty-two episodes
            somebody can watch. The claim is carried because it is occasionally
            the only hint that a season is incomplete; it is never what a client
            counts.
        poster_url:
          type: string
          nullable: true
          description: |
            Season artwork when the panel has some, which is uncommon. Null falls
            back to the series poster — never to a picture of ours.
        episodes:
          type: array
          description: Ordered by `episode_number`.
          items:
            $ref: '#/components/schemas/Episode'

    Episode:
      type: object
      description: |
        One episode. The thing that is actually played, and the thing a saved
        position points at.

        **`container_extension` is absent**, for the reason it is absent from
        `VodItem`: it is a fragment the server uses to build a playback URL, and
        no client has anything to do with it.

        **`series_id` is present**, and it is the field that makes a resume rail
        possible: `GET /me/progress` returns episode identifiers, and something
        has to group them back into series before anything can be drawn. See
        `GET /sources/{id}/episodes`.
      required: [id, series_id, source_id, season_number, episode_number]
      properties:
        id:
          type: string
          format: uuid
        series_id:
          type: string
          format: uuid
          description: The series this episode belongs to. See the schema note.
        source_id:
          type: string
          format: uuid
          description: |
            Carried for the same reason `PlaybackProgress` carries one: a client
            resolving a rail has to know which source to ask, and deriving it from
            the series would mean a lookup it does not have.
        external_id:
          type: string
          nullable: true
          description: Identifier used by the origin panel.
        season_number:
          type: integer
          format: int32
          minimum: 0
        episode_number:
          type: integer
          format: int32
          minimum: 0
        name:
          type: string
          nullable: true
          description: |
            Episode title, when the panel has one. **Null far more often than
            for a film**, and a client shows "Episode 4" rather than an empty line
            — the number is always there, the title is not.
        duration_seconds:
          type: integer
          format: int64
          nullable: true
          description: |
            Length of *this* episode, when the source states one. This is what a
            client uses to decide an episode is finished, never
            `Series.episode_run_time`.
        plot:
          type: string
          nullable: true
          description: |
            Episode synopsis, when the panel supplies one. It arrives with the
            tree, so unlike a film's it costs no extra call — one
            `get_series_info` returns every episode's.
        audio_codec:
          type: string
          nullable: true
          description: |
            The audio codec of this episode, **echoed verbatim** — `ac3`, `eac3`,
            `aac`, `dts`. Whatever the panel calls it, never reinterpreted, for
            the reason `Channel.quality` is not: deciding what a provider meant is
            a decision this layer does not get to make.

            **It is here so a client can warn before playing rather than after.**
            A browser decodes picture and sound separately, and no browser ships a
            Dolby Digital decoder — so an episode in `ac3` plays perfectly and
            silently, behind a mute button that does nothing. On a real catalogue
            that is roughly a third of the episodes. The web client says so on the
            episode before it is opened; the applications ignore this field
            entirely, because they decode it.

            **This is not the server deciding what a client can play.** It is a
            fact about the file. Which codecs a given player handles is that
            player's business and changes with the browser, the device and the
            year — computing it here would freeze one client's limits into the
            contract.

            **Null is normal and means "not known"**, not "no audio": panels state
            it inconsistently, and every episode ingested before this field
            existed has none until the next synchronisation. A client that finds
            null says nothing.
        audio_channels:
          type: integer
          format: int32
          nullable: true
          description: |
            Channel count of that track — `2`, `6` — when the panel states one.
            Carried beside the codec because it is the other half of the same
            sentence a client may want to write, and it arrives in the same tree
            for free.

    EpisodePage:
      type: object
      description: |
        Episodes resolved by identifier. The envelope of every other listing,
        used here so a client reuses what it already parses.
      required: [items, page, size, total_elements, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Episode'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elements:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int32

    EpisodePlaybackInfo:
      type: object
      description: |
        Everything the player needs to open one episode. Issued on demand, scoped
        to the owner.

        A third schema rather than a generic one with a renamed identifier: the
        three point at three different tables, and a player handed "an id" it
        cannot name is how an episode gets looked up among the films. The rules on
        `stream_url` are the ones written on `PlaybackInfo` and are not repeated
        — there is exactly one place they are stated.

        **An episode plays like a film**: a progressive file, not an HLS manifest,
        so seeking works only if the user's server answers `Range` requests. A
        player finds that out on the first attempt and says so.
      required: [episode_id, stream_url]
      properties:
        episode_id:
          type: string
          format: uuid
        stream_url:
          type: string
          format: password
          description: |
            **Sensitive**, and typed `format: password` for the reason given on
            `PlaybackInfo.stream_url`: it must never reach a log line at any
            level, `DEBUG` included.
        user_agent:
          type: string
          nullable: true
          description: |
            User-Agent the player should send, when the source requires a
            specific one. Null means the client's default.
        max_connections:
          type: integer
          nullable: true
          description: |
            Simultaneous streams the user's subscription allows. An episode counts
            against that ceiling exactly as a channel or a film does.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this URL stops being valid, when the panel issues time-limited
            links. Null means no known expiry.

    PlaybackInfo:
      type: object
      description: |
        Everything the player needs to open one channel. Issued on demand,
        scoped to the owner.
      required: [channel_id, stream_url]
      properties:
        channel_id:
          type: string
          format: uuid
        stream_url:
          type: string
          format: password
          description: |
            **Sensitive.** Typed `format: password` rather than `format: uri` on
            purpose: both map to a plain string, but `password` makes every
            generator mask this property in `toString()`. A stream URL must never
            reach a log line at any level, `DEBUG` included (AGENTS.md §5), and
            the contract is the cheapest place to guarantee that.

            Direct URL to the user's IPTV server, embedding their credentials in
            most Xtream panels.

            Never logged, never persisted client-side beyond the playback
            session, never shared between accounts. The player opens it directly;
            it does not transit through Lumo.
        user_agent:
          type: string
          nullable: true
          description: |
            User-Agent the player should send, when the source requires a
            specific one. Null means the client's default.
        max_connections:
          type: integer
          format: int32
          nullable: true
          description: |
            Simultaneous streams the user's subscription allows, echoed from the
            source so the player can explain a rejected stream (US-09).
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this URL stops being valid, when the panel issues time-limited
            links. Null means no known expiry; the client re-requests on failure
            rather than assuming.

    VodPlaybackInfo:
      type: object
      description: |
        Everything the player needs to open one film. Issued on demand, scoped to
        the owner.

        A separate schema rather than a `channel_id` renamed to something
        generic: that rename would break three generated clients today to spare
        one duplicated object, and the two identifiers really do point at two
        different tables. The rules on `stream_url` are the ones written on
        [`PlaybackInfo`](#/components/schemas/PlaybackInfo) and are not repeated
        here — there is exactly one place they are stated, and it is that one.

        **What a player must do differently with this URL.** It is a progressive
        file, not an HLS manifest: seeking works only if the user's server
        answers `Range` requests, and many do not. A player finds that out on the
        first attempt and says so, rather than drawing a scrubber that does
        nothing.
      required: [vod_item_id, stream_url]
      properties:
        vod_item_id:
          type: string
          format: uuid
        stream_url:
          type: string
          format: password
          description: |
            **Sensitive**, and typed `format: password` for the reason given on
            `PlaybackInfo.stream_url`: it must never reach a log line at any
            level, `DEBUG` included (AGENTS.md §5).
        user_agent:
          type: string
          nullable: true
          description: |
            User-Agent the player should send, when the source requires a
            specific one. Null means the client's default.
        max_connections:
          type: integer
          format: int32
          nullable: true
          description: |
            Simultaneous streams the user's subscription allows. A film counts
            against that ceiling exactly as a channel does.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this URL stops being valid, when the panel issues time-limited
            links. Null means no known expiry.

    EpgProgramme:
      type: object
      description: One programme from the guide.
      required: [id, source_id, tvg_id, starts_at, ends_at, title]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        tvg_id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          description: Genre as advertised by the guide. Free-form, not an enum.

    EpgProgrammeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EpgProgramme'

    # ---- userdata ----------------------------------------------------------

    FavoriteGroup:
      type: object
      description: |
        A user-defined grouping of favourites. A default group is created on the
        first add.

        A group belongs to the **account**, not to a source: one group holds
        channels from several subscriptions, and it survives a
        re-synchronisation whole.
      required: [id, name, position, is_default]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          format: int32
        is_default:
          type: boolean
          description: |
            True for the one group created on the first add — where
            `POST /me/favorites` lands without a `group_id`, and where
            `DELETE /me/favorite-groups/{id}` empties the others.

            **Why a flag and not a sentinel in `name`.** The server has to call
            that group something, and it calls it `Favorites`, in English: a
            user-visible string in one language, which no client could translate
            because nothing marked it as the default one. The same problem was
            solved once for M3U entries with no `group-title`, by a sentinel in
            `external_id` — but `name` here belongs to the user the moment they
            rename it, and a client must still know which group is the default
            afterwards. A flag survives the rename; a sentinel would not.

            A client renders its own wording while this is true **and** the name
            is still the server's; once the user has renamed the group, their
            name wins.

    FavoriteGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteGroup'

    CreateFavoriteGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        position:
          type: integer
          format: int32
          nullable: true
          description: Appended last when omitted.

    UpdateFavoriteGroupRequest:
      type: object
      description: |
        Omitted properties are left unchanged. A body that changes nothing is
        accepted and returns the group as it stands.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        position:
          type: integer
          format: int32
          description: |
            The index the group takes in the list, counted from zero. Groups it
            displaces shift down; a value past the end appends. Positions stay
            contiguous.

    Favorite:
      type: object
      description: |
        A channel bookmarked by the user. Survives a re-synchronisation as long
        as the channel keeps its identity within the source.
      required: [id, group_id, source_id, channel_id, position]
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32

    FavoriteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Favorite'

    AddFavoriteRequest:
      type: object
      description: |
        `source_id` is not accepted: it is derived from the channel, so the two
        cannot disagree.
      required: [channel_id]
      properties:
        channel_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          nullable: true
          description: Defaults to the account's default group, created on first use.
        position:
          type: integer
          format: int32
          nullable: true
          description: Appended last when omitted.

    UpdateFavoriteRequest:
      type: object
      description: |
        Omitted properties are left unchanged. `channel_id` is not accepted:
        pointing a favourite at another channel is adding a different favourite,
        not editing this one.
      properties:
        group_id:
          type: string
          format: uuid
          description: The group to move this favourite into.
        position:
          type: integer
          format: int32
          description: |
            The index within the target group, counted from zero. Sent alone, it
            reorders within the group the favourite is already in.

    PlaybackProgress:
      type: object
      description: Where the user stopped watching a VOD item or an episode.
      required: [id, source_id, item_type, item_ref, position_ms, updated_at]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
          description: |
            The source this position belongs to. Returned because it is part of
            the key: a client reading a page of progress has to be able to tell
            two subscriptions' `1042` apart, exactly as the server does.
        item_type:
          $ref: '#/components/schemas/ProgressItemType'
        item_ref:
          type: string
          description: |
            Identifier of the item, opaque to this API. For `VOD` it is
            `VodItem.id` and for `EPISODE` it is `Episode.id` — see
            `SaveProgressRequest.item_ref`, where both are argued — which is what
            lets a "continue watching" rail resolve these rows through
            `GET /sources/{id}/vod?ids=` and `GET /sources/{id}/episodes?ids=`.
        position_ms:
          type: integer
          format: int64
          minimum: 0
          description: Playback position, in milliseconds.
        duration_ms:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: Total duration, when known.
        updated_at:
          type: string
          format: date-time

    PlaybackProgressPage:
      type: object
      description: |
        One page of saved positions. Same shape as `ChannelPage`, on purpose:
        one pagination envelope to learn, not two.
      required: [items, page, size, total_elements, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackProgress'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page.
        size:
          type: integer
          format: int32
          description: Requested page size, after the server-side cap.
        total_elements:
          type: integer
          format: int64
          description: Total rows matching the filters.
        total_pages:
          type: integer
          format: int32


    RecentChannel:
      type: object
      description: |
        One live channel the user watched, and when.

        Carries identifiers and nothing else: the name, the logo and the current
        programme are already reachable from the catalogue and the guide, and
        denormalising them here would mean a rail showing a channel name that
        the last ingestion has since changed.
      required: [channel_id, source_id, watched_at]
      properties:
        channel_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
          description: Derived from the channel, so the two cannot disagree.
        watched_at:
          type: string
          format: date-time
          description: Last time playback started on this channel.

    RecentChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecentChannel'

    RecordRecentChannelRequest:
      type: object
      description: |
        `source_id` is not accepted: it is derived from the channel, exactly as
        on `AddFavoriteRequest`.
      required: [channel_id]
      properties:
        channel_id:
          type: string
          format: uuid
    SaveProgressRequest:
      type: object
      description: Upsert keyed on `(source_id, item_type, item_ref)` for the caller.
      required: [source_id, item_type, item_ref, position_ms]
      properties:
        source_id:
          type: string
          format: uuid
          description: |
            The source the item belongs to, and **part of the key**.

            The key is `(source_id, item_type, item_ref)` because `item_ref` is
            declared opaque: nothing in this API constrains what a client puts
            there, and two subscriptions using `1042` for two different films
            would otherwise collide. The bug would look like a film mysteriously
            resuming twenty minutes in.

            **What clients actually send is one of our own identifiers** — see
            `item_ref` below — which makes this field redundant for both types
            and not for the schema. It stays required: a required field that is
            sometimes redundant is cheaper than a key that changes shape, and it
            is what lets a client filter a page of progress down to one source
            without resolving every row first.

            The alternative was a convention — prefix `item_ref` with the source
            id — and it was refused: a convention is a rule three clients have to
            apply identically, and one of them getting it wrong produces exactly
            the collision this field prevents, silently.
        item_type:
          $ref: '#/components/schemas/ProgressItemType'
        item_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Identifier of the item, opaque to this endpoint — it is stored and
            compared, never joined on.

            **For `VOD`, send `VodItem.id`.** That was decided when the resume
            rail was built (`S5-11`) and it is worth stating rather than leaving
            to each client: a "continue watching" rail has to turn these rows
            back into films with posters and titles, and
            `GET /sources/{id}/vod?ids=` is the only operation that does. A
            panel-minted reference would have needed a lookup operation of its
            own, for no difference anybody could see.

            It costs nothing in stability: `vod_item` is upserted on
            `(source_id, external_id)`, so a row keeps its id across
            re-synchronisations — which is the property a panel-minted reference
            would have been chosen for.

            **For `EPISODE`, send `Episode.id`** — decided in `S6-01`, on the
            same argument and with one more step to resolve.

            A "continue watching" rail for series shows **series**, not episodes:
            nobody remembers an episode identifier, they remember having got to
            episode four. So a saved position has to resolve to a series *and* to
            a place in it. `GET /sources/{id}/episodes?ids=` turns these rows into
            episodes carrying `series_id`, `season_number` and
            `episode_number`; `GET /sources/{id}/series?ids=` turns those into
            posters and titles. Two requests for a whole rail, not two per row.

            That resolver exists **because of this field**, and it was added when
            this decision was taken rather than discovered when the rail was
            built — which is what happened for films in sprint 5.

            The stability argument is the film one: `episode` is upserted on
            `(series_id, external_id)` — the panel's own episode identifier, which
            unlike a season's always exists because it is what the playback URL is
            built from. A row therefore keeps its id across re-synchronisations
            and across the tree being refetched when its cache expires.
        position_ms:
          type: integer
          format: int64
          minimum: 0
        duration_ms:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: |
            Total duration, when the source states one. Sent so a client can
            decide an item is finished without a second lookup.

            **Finished is a threshold, not an event**: past 95 % of the duration
            an item leaves the "continue watching" rail. With no duration — and
            many panels give none — it never leaves, which is the right default:
            a film that lingers in the rail is an annoyance, a film that vanishes
            before the end is a loss.

    # ---- billing -----------------------------------------------------------

    CreateCheckoutSessionRequest:
      type: object
      description: |
        What the caller is allowed to influence when opening a checkout. Which
        is: almost nothing, deliberately.
      required: [plan]
      properties:
        plan:
          allOf:
            - $ref: '#/components/schemas/Plan'
          description: |
            The tier being bought. `PREMIUM` is the only purchasable value; a
            request for `FREE` is `400` `VALIDATION_FAILED`.

            The property exists rather than being implied so that a second paid
            tier does not change the shape of this operation.
        locale:
          allOf:
            - $ref: '#/components/schemas/Locale'
          description: |
            Language Stripe renders the checkout in. Defaults to the user's
            `locale`.

    CreatePortalSessionRequest:
      type: object
      description: |
        Optional body. The portal needs nothing but the authenticated caller;
        `locale` is here for the same reason as on checkout.
      properties:
        locale:
          allOf:
            - $ref: '#/components/schemas/Locale'
          description: Language the portal renders in. Defaults to the user's `locale`.

    BillingSession:
      type: object
      description: |
        A redirect target on Stripe's side. Not a grant of anything: the
        entitlement moves when the webhook writes it, and only then.
      required: [url]
      properties:
        url:
          type: string
          format: password
          description: |
            **Sensitive.** Typed `format: password` rather than `format: uri`
            for the same reason as `PlaybackInfo.stream_url`: both are plain
            strings, but `password` makes every generator mask the property in
            `toString()`.

            This URL is a bearer capability. Whoever holds it reaches a session
            opened for this account — on the portal, that means invoices, the
            payment method and the cancel button. It must not reach a log line
            at any level, `DEBUG` included (AGENTS.md §5).

            Single-use and short-lived. Redirect to it immediately; never store
            it, never put it in a query parameter of your own, never email it.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the session stops being redeemable, when Stripe reports it.
            Null means unknown; the client redirects immediately either way
            rather than holding the URL.
