# ==============================================================================
# Overlay bringing the development stack into the Playwright environment.
#
# Never used on its own — it overrides docker-compose.yml and is applied by
# apps/web/e2e/global-setup.ts:
#
#   docker compose -p lumo-e2e -f docker-compose.yml -f docker-compose.e2e.yml \
#     up -d --wait --build postgres lumo-api
#
# Three differences from the development stack, and each one exists so that an
# end-to-end run cannot disturb — or be disturbed by — a stack a developer
# already has running:
#
#   1. Its own project name and container names.
#   2. Its own published ports, passed in as POSTGRES_PORT and LUMO_API_PORT.
#   3. A cluster in RAM instead of ./docker-data/postgres.
#
# Secrets are not in this file and never will be. They are generated per run in
# apps/web/e2e/support/stack.ts and passed through the environment: a committed
# .env would be refused by the `no-content` CI job (AGENTS.md §5), and rightly.
# ==============================================================================

services:

  postgres:
    container_name: lumo-e2e-postgres
    # A test stack that comes back after a reboot is a test stack nobody
    # remembers starting.
    restart: "no"
    # The development file bind-mounts ./docker-data/postgres. Reusing it here
    # would run the tests against a developer's own cluster - and, on the first
    # run, against a password that directory was initialised with months ago.
    # `!reset` drops the mount rather than merging with it, which is what a
    # plain list would do.
    volumes: !reset []
    # The cluster lives in RAM, so it is created and thrown away with the run.
    # PGDATA points one level below this mount, as in the development file.
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumo_e2e}

  lumo-api:
    container_name: lumo-e2e-api
    restart: "no"
    environment:
      # The production limits are 5 per IP per minute (US-01, US-02) and they
      # are right for a front door. An end-to-end run is not one: every request
      # arrives from a single host address, so the whole suite shares one
      # bucket. Raised here rather than in the application, because the limit
      # being tested is the one that ships.
      LUMO_RATE_LIMIT_AUTH_ATTEMPTS_PER_MINUTE: ${LUMO_RATE_LIMIT_AUTH_ATTEMPTS_PER_MINUTE:-1000}
      LUMO_RATE_LIMIT_DEVICE_APPROVE_ATTEMPTS_PER_MINUTE: ${LUMO_RATE_LIMIT_DEVICE_APPROVE_ATTEMPTS_PER_MINUTE:-1000}
      # The FREE plan's source ceiling, pinned back to the shipped value.
      #
      # This stack runs SPRING_PROFILES_ACTIVE=dev, and `application-dev.yml`
      # raises `lumo.plans.free.max-sources` to 1000 so that a developer wiring
      # screens is not rationed. That is right for a developer and wrong here:
      # the suite asserts that a second source is refused, which is a property of
      # the product and not of a profile. Without this line the assertion passes
      # only for as long as the API image is stale.
      #
      # The device ceiling is deliberately left relaxed: nothing here tests it,
      # and every sign-in in the suite holds a session against it.
      LUMO_PLANS_FREE_MAX_SOURCES: ${LUMO_PLANS_FREE_MAX_SOURCES:-1}
      # The bench lives on the compose network, so it answers on a 172.x
      # address, which PrivateAddressGuard refuses by default — and must keep
      # refusing in production, where a source pointing at an internal address
      # is a way to map our own network. Opened here and nowhere else.
      LUMO_INGEST_ALLOW_PRIVATE_HOSTS: "true"

  # The source test bench, defined in docker-compose.yml behind the `bench`
  # profile. Naming it on the command line — global-setup.ts does — is what
  # enables that profile, so nothing here has to repeat the service.
  #
  # It is published on 18081 by the base file, because the BROWSER has to reach
  # the streams: the playlist names them by URL and the player opens them
  # directly (ADR 0007). BENCH_PUBLIC_URL is left at its default, which is
  # exactly that address seen from this machine.
  bench:
    container_name: lumo-e2e-bench
    restart: "no"

# ------------------------------------------------------------------ network ---
#
# The fourth difference, and the one that cost an afternoon to find.
#
# The development file declares `networks: lumo: name: lumo` — a fixed name, so
# every project that includes it joins the SAME docker network. Both stacks then
# publish the alias `postgres` on it, and the end-to-end API resolves whichever
# container docker's DNS happens to return first. Half the time that is the
# developer's own database, whose password is not the one generated for this
# run, and the container dies on `password authentication failed for user
# "lumo"` — intermittently, and only on machines where the development stack is
# up, which is to say on a developer's machine and never in CI.
#
# Renaming the network is enough: two networks, two DNS namespaces, one
# `postgres` in each.
networks:
  lumo:
    name: lumo-e2e
