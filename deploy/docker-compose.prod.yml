# ==============================================================================
# Lumo TV — production stack on one VPS (S16B-01, docs/ops/deploy-vps.md).
#
#   cd deploy && cp .env.example .env     (then fill in every value)
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# The API and site images are pulled from GHCR, built by
# .github/workflows/images.yml and tagged LUMO_VERSION; the server builds
# nothing. docker-compose.build.yml builds them locally instead, for a trial run.
#
# Five services, one network, one port pair open to the world (80/443, Caddy):
#   - postgres   the database, in LUMO_DATA_DIR on the host, never published;
#   - lumo-api   the API (apps/api/Dockerfile), behind Caddy at LUMO_API_DOMAIN;
#   - lumo-web   the site (apps/web/Dockerfile), behind Caddy at LUMO_WEB_DOMAIN;
#   - caddy      TLS certificates (Let's Encrypt) and reverse proxy;
#   - backup     a pg_dump a day, kept LUMO_BACKUP_KEEP_DAYS days in ./backups.
# Optional, profile `bench`: the source test bench, at LUMO_BENCH_DOMAIN, so
# testers have a source with nothing real in it (apps/web/e2e/bench).
# Optional, profile `smtp4dev`: catches every email the API sends, until a real
# SMTP provider replaces it. Nothing leaves the server.
#
# Each service starts through log-tee.sh, which copies its output to
# LUMO_DATA_DIR/logs/<service>. Its entrypoint below therefore names the image's
# own command: a change to that command in an image has to be repeated here.
#
# Media never goes through this stack (ADR 0007): players open the user's
# stream directly. Every secret comes from deploy/.env, which is never committed.
# ==============================================================================

name: lumo-prod

services:

  # Runs once at each start. The API and the site are not root (apps/*/Dockerfile,
  # uid 10001), and Docker creates a missing host directory as root.
  log-dirs:
    image: postgres:16-alpine
    network_mode: none
    volumes:
      - ${LUMO_DATA_DIR:?set LUMO_DATA_DIR in deploy/.env}/logs:/logs
    entrypoint: ["sh", "-c", "mkdir -p /logs/lumo-api /logs/lumo-web && chown 10001 /logs/lumo-api /logs/lumo-web"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/log-tee.sh", "docker-entrypoint.sh", "postgres"]
    environment:
      LOG_KEEP_DAYS: ${LUMO_LOG_KEEP_DAYS:-14}
      POSTGRES_DB: ${POSTGRES_DB:-lumo}
      POSTGRES_USER: ${POSTGRES_USER:-lumo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # One level below the mount, as in the development file: a trial run on
      # Windows or macOS file sharing refuses to hand over the mount's root.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # A directory, not a Docker-managed volume: it shows on the host, and
      # neither `down -v` nor `docker volume prune` can take it. The variable has
      # no default so that a server still on the old volumes refuses to start
      # rather than come up on an empty database (docs/ops/deploy-vps.md).
      - ${LUMO_DATA_DIR}/postgres:/var/lib/postgresql/data
      - ${LUMO_DATA_DIR}/logs/postgres:/logs
      - ./log-tee.sh:/log-tee.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumo} -d ${POSTGRES_DB:-lumo}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      lumo:
        ipv4_address: 10.89.30.20

  lumo-api:
    image: ${LUMO_IMAGE_PREFIX:-ghcr.io/beyhamza}/lumo-api:${LUMO_VERSION:?set LUMO_VERSION in deploy/.env}
    restart: unless-stopped
    entrypoint: ["sh", "/log-tee.sh", "java", "-jar", "app.jar"]
    depends_on:
      log-dirs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ${LUMO_DATA_DIR}/logs/lumo-api:/logs
      - ./log-tee.sh:/log-tee.sh:ro
    environment:
      LOG_KEEP_DAYS: ${LUMO_LOG_KEEP_DAYS:-14}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lumo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lumo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      SPRING_LIQUIBASE_ENABLED: "true"

      LUMO_JWT_SECRET: ${LUMO_JWT_SECRET:?set LUMO_JWT_SECRET in deploy/.env}
      LUMO_ENCRYPTION_MASTER_KEY: ${LUMO_ENCRYPTION_MASTER_KEY:?set LUMO_ENCRYPTION_MASTER_KEY in deploy/.env}

      LUMO_WEB_BASE_URL: https://${LUMO_WEB_DOMAIN:?set LUMO_WEB_DOMAIN in deploy/.env}
      LUMO_CORS_ALLOWED_ORIGINS: https://${LUMO_WEB_DOMAIN}
      # Caddy, and the web server that calls the API on a visitor's behalf
      # (apps/web/src/lib/api/client.ts forwards X-Forwarded-For). Fixed
      # addresses on the network below, so the list cannot drift.
      LUMO_TRUSTED_PROXIES: 10.89.30.10,10.89.30.11
      LUMO_INGEST_ALLOW_PRIVATE_HOSTS: "false"

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST in deploy/.env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS:-true}
      LUMO_MAIL_FROM: ${LUMO_MAIL_FROM:?set LUMO_MAIL_FROM in deploy/.env}

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      lumo:
        ipv4_address: 10.89.30.12

  lumo-web:
    image: ${LUMO_IMAGE_PREFIX:-ghcr.io/beyhamza}/lumo-web:${LUMO_VERSION:?set LUMO_VERSION in deploy/.env}
    restart: unless-stopped
    entrypoint: ["sh", "/log-tee.sh", "node", "server.js"]
    depends_on:
      log-dirs:
        condition: service_completed_successfully
      lumo-api:
        condition: service_healthy
    volumes:
      - ${LUMO_DATA_DIR}/logs/lumo-web:/logs
      - ./log-tee.sh:/log-tee.sh:ro
    environment:
      LOG_KEEP_DAYS: ${LUMO_LOG_KEEP_DAYS:-14}
      # The server talks to the API on the private network, not through Caddy.
      API_BASE_URL: http://lumo-api:8080/v1
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env}
      SESSION_COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/fr || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      lumo:
        ipv4_address: 10.89.30.11

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/log-tee.sh", "caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      - lumo-api
      - lumo-web
    ports:
      - "${LUMO_HTTP_PORT:-80}:80"
      - "${LUMO_HTTPS_PORT:-443}:443"
      - "${LUMO_HTTPS_PORT:-443}:443/udp"
    environment:
      LOG_KEEP_DAYS: ${LUMO_LOG_KEEP_DAYS:-14}
      LUMO_API_DOMAIN: ${LUMO_API_DOMAIN:?set LUMO_API_DOMAIN in deploy/.env}
      LUMO_WEB_DOMAIN: ${LUMO_WEB_DOMAIN}
      LUMO_ACME_EMAIL: ${LUMO_ACME_EMAIL:?set LUMO_ACME_EMAIL in deploy/.env}
      LUMO_CADDY_GLOBAL: ${LUMO_CADDY_GLOBAL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/caddy.d:ro
      - ${LUMO_DATA_DIR}/caddy/data:/data
      - ${LUMO_DATA_DIR}/caddy/config:/config
      - ${LUMO_DATA_DIR}/logs/caddy:/logs
      - ./log-tee.sh:/log-tee.sh:ro
    networks:
      lumo:
        ipv4_address: 10.89.30.10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # After the API: its migrations create the schema the first dump should hold.
    depends_on:
      lumo-api:
        condition: service_healthy
    environment:
      LOG_KEEP_DAYS: ${LUMO_LOG_KEEP_DAYS:-14}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-lumo}
      PGUSER: ${POSTGRES_USER:-lumo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${LUMO_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - ${LUMO_DATA_DIR}/logs/backup:/logs
      - ./log-tee.sh:/log-tee.sh:ro
    entrypoint: ["sh", "/log-tee.sh", "sh", "/backup.sh"]
    networks:
      lumo:
        ipv4_address: 10.89.30.21

  bench:
    image: nginx:1.27-alpine
    profiles: ["bench"]
    restart: unless-stopped
    environment:
      LOG_KEEP_DAYS: ${LUMO_LOG_KEEP_DAYS:-14}
      BENCH_PUBLIC_URL: https://${LUMO_BENCH_DOMAIN:-bench.invalid}
    volumes:
      - ../apps/web/e2e/bench/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/web/e2e/bench/entrypoint.sh:/bench/entrypoint.sh:ro
      - ../apps/web/e2e/bench/xmltv.awk:/bench/xmltv.awk:ro
      - ../apps/web/e2e/bench/fixtures:/bench/fixtures:ro
      - ${LUMO_DATA_DIR}/logs/bench:/logs
      - ./log-tee.sh:/log-tee.sh:ro
    entrypoint: ["sh", "/log-tee.sh", "/bin/sh", "/bench/entrypoint.sh"]
    networks:
      lumo:
        ipv4_address: 10.89.30.30

  smtp4dev:
    image: rnwood/smtp4dev:3.15.0
    profiles: ["smtp4dev"]
    restart: unless-stopped
    entrypoint: ["sh", "/log-tee.sh", "dotnet", "/app/Rnwood.Smtp4dev.dll"]
    environment:
      LOG_KEEP_DAYS: ${LUMO_LOG_KEEP_DAYS:-14}
    # Its inbox shows every password-reset link and has no login, so it is never
    # behind Caddy: on the server's loopback only, reached through an SSH tunnel.
    # The SMTP port stays on the private network.
    ports:
      - "127.0.0.1:${LUMO_SMTP4DEV_PORT:-5080}:80"
    volumes:
      - ${LUMO_DATA_DIR}/smtp4dev:/smtp4dev
      - ${LUMO_DATA_DIR}/logs/smtp4dev:/logs
      - ./log-tee.sh:/log-tee.sh:ro
    networks:
      lumo:
        ipv4_address: 10.89.30.31

networks:
  lumo:
    name: lumo-prod
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.30.0/24
