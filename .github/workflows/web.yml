# ==============================================================================
# apps/web — lint, test, build (S0-08).
#
# The pnpm workspace is rooted at apps/web, not at the repository, so every
# command runs from there.
#
# The last step is the one worth explaining. docs/architecture.md §4 says the
# marketing zone is served statically: no client component, no authenticated
# call, nothing rendered per request. That is not a preference, it is what makes
# those pages indexable and cheap, and it is broken by accident — one `useState`
# in a shared component, one `cookies()` read in a layout, and the route
# silently becomes dynamic. Nothing in the code says so afterwards; the only
# place it shows is the build output, where ● means prerendered and ƒ means
# server-rendered on demand. So the build output is what this asserts on.
#
# If Next ever changes those symbols this step fails with a confusing message.
# That is the trade: a check that reads the build output is coupled to the build
# output, and the alternative is no check at all for a rule three pages depend
# on.
# ==============================================================================

name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/contracts/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:
    inputs:
      anchored_gd12:
        description: 'GD-12 sous horloge contrôlée (E2E_ANCHOR = prochain 23:50 Europe/Paris)'
        type: boolean
        default: false
      fault_gd10:
        description: 'GD-10 sur pile dédiée (LUMO_EPG_FAULT=503) : ne joue que s9-06-04-fault'
        type: boolean
        default: false

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-time only, and deliberately not a secret: this value seals no real
  # session. The application refuses to start without one, so the build needs
  # something 32 characters long to get past that check.
  SESSION_SECRET: ci-build-only-secret-not-used-for-anything
  NEXT_PUBLIC_SITE_URL: https://lumo.tv
  API_BASE_URL: http://localhost:8080/v1
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/v1
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Lint, typecheck, test, build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Separate from lint on purpose: ESLint does not type-check, and the
      # mistakes that matter most here — a field renamed in the contract — are
      # only visible to tsc.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build | tee build.log

      - name: The marketing zone must still be prerendered
        run: |
          missing=""
          for route in /fr /en /fr/guides /en/guides; do
            if ! grep -qE "● ${route}$" build.log; then
              missing="${missing} ${route}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These marketing routes are no longer prerendered:${missing}"
            echo "A page in the marketing zone imports a client component, reads cookies or"
            echo "headers, or calls an authenticated API (docs/architecture.md §4)."
            echo "--- routes as built ---"
            sed -n '/Route (app)/,/^$/p' build.log
            exit 1
          fi

      # Chromium only. Both Playwright projects are Chromium-based - the second
      # is a Pixel 7 viewport, because /activate is used standing up with a
      # phone in hand - so Firefox and WebKit would be download time spent on
      # nothing.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      # Runs against a production build, which playwright.config.ts starts
      # itself. That repeats the build above; the alternative is a bespoke CI
      # path that no developer runs locally, and this way `pnpm test:e2e` means
      # the same thing on both sides.
      #
      # It also brings up PostgreSQL and lumo-api: e2e/global-setup.ts runs
      # `docker compose --build` from docker-compose.e2e.yml and waits on both
      # healthchecks. No step is needed here for that, deliberately - a stack
      # started by the workflow would be a stack no developer can reproduce.
      #
      # Locally the image is rebuilt only when the API sources move, and a stack
      # left up is adopted rather than restarted. Neither shortcut applies here,
      # and both should not: a runner checks out a fresh tree with no
      # apps/web/.e2e fingerprint, and nothing is listening, so every run builds
      # from source and starts clean. That is the property CI is for.
      #
      # The cost is real and worth stating: the Gradle cache mount does not
      # survive between runs, so expect several minutes before the first test
      # executes. If that becomes the bottleneck, the fix is a buildx cache
      # keyed on the API sources - not dropping the stack.
      # Default pass: real time. GD-12 skips itself with its reason, the GD-10
      # fault spec skips itself too, and the anchor is "now"
      # (e2e/support/stack.ts).
      - name: End-to-end tests
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.anchored_gd12 && !inputs.fault_gd10) }}
        run: pnpm test:e2e

      # The anchored pass, opt-in and never a fixed date: the API's XMLTV
      # importer keeps only [now − 1 day, now + 3 days], so a date written into
      # a file would expire. The helper prints the NEXT 23:50 Europe/Paris,
      # whenever that is, and the same instant reaches the guide and the SSR
      # clock through stack.ts.
      - name: Resolve the GD-12 anchor
        id: anchor
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.anchored_gd12 }}
        run: echo "value=$(node e2e/support/next-paris-2350.mjs)" >> "$GITHUB_OUTPUT"

      - name: End-to-end tests (anchored GD-12)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.anchored_gd12 }}
        env:
          E2E_ANCHOR: ${{ steps.anchor.outputs.value }}
        # No `--` before the path: pnpm forwards it to Playwright verbatim, and
        # Playwright then ignores the file filter and runs the whole suite.
        run: pnpm test:e2e e2e/s9-07-gd12-midnight.journey.spec.ts

      # The fault pass, opt-in and on a dedicated stack. `E2E_FAULT_ARMED=1`
      # makes the API serve 503 on every guide read (EpgFaultInjection) AND gates
      # the spec on, so the two cannot disagree. A global guide fault would fail
      # every other guide spec, so only the GD-10 file is played. `E2E_STACK=docker`
      # refuses to adopt a stack that was started without the fault.
      - name: End-to-end tests (armed GD-10 fault)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fault_gd10 }}
        env:
          E2E_FAULT_ARMED: '1'
          E2E_STACK: docker
        run: pnpm test:e2e e2e/s9-06-04-fault.journey.spec.ts

      # A failed browser test is unreadable from a log alone. The report carries
      # the trace of the retried run (trace: on-first-retry).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
