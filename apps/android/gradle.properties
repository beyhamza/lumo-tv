# Gradle / AGP behaviour for the Lumo Android build.

# 17 modules configure and compile in parallel; 2 GB is the point below which
# Kotlin compilation and R8 start trading in swap on a 16 GB machine.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin compilation in a long-lived daemon rather than a process per module.
kotlin.daemon.jvmargs=-Xmx2g

# AndroidX only. The support library has been end-of-life since 2018 and Jetifier
# rewrites bytecode at build time, which is slow and occasionally wrong.
android.useAndroidX=true
android.enableJetifier=false


# R8 full mode. Keep rules live in each module's consumer-rules.pro.
android.enableR8.fullMode=true

# Non-transitive R classes: a module sees its own resources, not those of its
# dependencies. Catches the accidental cross-module resource reference that
# would otherwise let app-tv pull a mobile-only string.
android.nonTransitiveRClass=true
