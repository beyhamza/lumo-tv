# Version catalogue for the Lumo Android project.
#
# ONE catalogue for both applications and every module (AGENTS.md §4). A module
# never writes a version literal in its build file: if a version appears in a
# `build.gradle.kts`, it is a bug. That is what keeps `tv.lumo.android` and
# `tv.lumo.androidtv` from silently drifting onto different Room or Media3
# versions and behaving differently on the same shared code (ADR 0004).
#
# Do not bump a version without being asked (AGENTS.md §7).

[versions]
# ---- Toolchain --------------------------------------------------------------
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
# The Android Gradle Plugin runs on JDK 17+; every module compiles to 17
# bytecode. Unrelated to apps/api's Java 25 — the two builds are independent.
jvmToolchain = "17"
compileSdk = "37"
minSdk = "24"
targetSdk = "37"
# java.time reaches API 24 through desugaring: the generated client models use
# OffsetDateTime (config/kotlin.yaml sets dateLibrary=java8) and Android only
# ships java.time natively from API 26.
desugarJdkLibs = "2.1.5"

# ---- Contract ---------------------------------------------------------------
# Must stay identical to packages/contracts/openapitools.json and to
# apps/api/gradle/libs.versions.toml. Three generator versions for one contract
# would defeat the point of having a contract (ADR 0001).
openapiGenerator = "7.14.0"

# ---- AndroidX / Compose -----------------------------------------------------
androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.9.8"
composeBom = "2026.08.00"
# Compose for TV. NOT part of the Compose BOM — androidx.tv ships on its own
# cadence, so it carries its own version here.
androidxTvMaterial = "1.1.0"
androidxDataStore = "1.2.1"
androidxRoom = "2.8.4"
androidxPaging = "3.5.1"
androidxMedia3 = "1.11.0"
androidxHiltNavigationCompose = "1.4.0"

# ---- Injection --------------------------------------------------------------
hilt = "2.60.1"

# ---- Network ----------------------------------------------------------------
retrofit = "3.0.0"
okhttp = "5.5.0"
# Reflection-based Moshi: the generated models carry @Json but not
# @JsonClass(generateAdapter = true), so there is no compile-time adapter to
# link against. See the consumer rules in core/network.
moshi = "1.15.2"
kotlinxCoroutines = "1.11.0"

# ---- Test -------------------------------------------------------------------
junit = "4.13.2"
truth = "1.4.5"
turbine = "1.2.1"
androidxTestJunit = "1.3.0"

[libraries]
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "androidxTvMaterial" }

androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "androidxDataStore" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidxRoom" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "androidxRoom" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidxRoom" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "androidxRoom" }

androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "androidxPaging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "androidxPaging" }
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "androidxPaging" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidxMedia3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "androidxMedia3" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "androidxMedia3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "androidxMedia3" }

androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHiltNavigationCompose" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
retrofit-converter-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
moshi-core = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

# Referenced by build-logic so the convention plugins can put these plugins on
# their own classpath: a plugin cannot apply another plugin by id unless that
# plugin is already resolvable from where it runs.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "androidxRoom" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "androidxRoom" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }

# Convention plugins, declared here so a module reads
# `alias(libs.plugins.lumo.android.library)` and never a raw string.
lumo-android-application = { id = "lumo.android.application" }
lumo-android-application-compose = { id = "lumo.android.application.compose" }
lumo-android-library = { id = "lumo.android.library" }
lumo-android-library-compose = { id = "lumo.android.library.compose" }
lumo-android-hilt = { id = "lumo.android.hilt" }
lumo-android-room = { id = "lumo.android.room" }
lumo-android-feature = { id = "lumo.android.feature" }
