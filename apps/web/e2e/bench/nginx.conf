# =============================================================================
# The source test bench (S3-01, extends S2-03).
#
# Fixed paths that reproduce, on demand, what a user's own IPTV server does when
# it misbehaves. Without it the qualification of US-06 and US-07 is not
# executable: there is no way to provoke a refused credential or an empty
# playlist by typing a real address, and no way to do it twice the same way.
#
# NOT IN HERE, and it must stay that way: any real channel, any real bouquet
# logo, any real stream URL (AGENTS.md §1). The CI job `no-content` refuses the
# repository otherwise. The playlist names Chaîne 01 to Chaîne 05 and points
# them at this container.
#
# The document root is BUILT at start-up by entrypoint.sh, not mounted: the
# playlist is a template whose host depends on where the player runs, and the
# oversized payload is generated because committing two hundred megabytes would
# be absurd. The fixtures themselves are mounted read-only at /bench/fixtures.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    # A playlist that parses and yields five channels in three groups, with
    # tvg-chno on some and a quality token in some names. That combination is
    # deliberate: it exercises the nullable half of `number` and `quality` as
    # well as the populated half.
    location = /playlist.m3u {
        default_type audio/x-mpegurl;
    }

    # Parses, holds nothing. The server answers SOURCE_EMPTY, and a client that
    # showed a success screen over this would be lying about an empty catalogue.
    location = /empty.m3u {
        default_type audio/x-mpegurl;
    }

    # Channels AND films in one playlist — the seventh path (S5-06). Every entry
    # exercises one ruling of ADR 0009, including the two cases where the rule is
    # deliberately wrong. Read the fixture: it is the only place those two are
    # written down as something to look at rather than something to fix.
    location = /mixed.m3u {
        default_type audio/x-mpegurl;
    }

    # Where the films of /mixed.m3u point. The same generated colour bars as
    # /stream/, served as one file rather than as a manifest — which is what a
    # film is, and what makes seeking depend on Range support rather than on a
    # playlist. No real content, nothing anybody owns (AGENTS.md §1).
    location /film/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Accept-Ranges bytes always;
        types { video/mp4 mp4; video/x-matroska mkv; }
        default_type application/octet-stream;
        alias /usr/share/nginx/html/film/;
    }

    # The same, under the path segment an exported Xtream playlist uses. It is
    # the classifier's second signal, and it needs its own location because what
    # decides here is the PATH — the entry it serves carries a token after the
    # extension, which is precisely the case that must not be read as a filename.
    #
    # Rewritten rather than aliased: a real panel's `/movie/user/pass/9001.mp4`
    # has a shape this bench has no reason to reproduce directory for directory.
    location /movie/ {
        rewrite ^/movie/.*$ /film/le-voyage.mp4 last;
    }

    # More than the API will read (SOURCE_TOO_LARGE), and the sixth path of the
    # bench — the one S2-03 asked for and nothing served until now.
    #
    # Served pre-gzipped, with the encoding stated rather than negotiated: what
    # is on disk is a few hundred kilobytes, what the API decodes is past its
    # two-hundred-megabyte cap. That asymmetry is the point and not a shortcut —
    # `SizeCappedInputStream` counts the bytes it READS, exactly because a
    # compressed body expands after its Content-Length was written, and this is
    # the only fixture that exercises that.
    #
    # `curl` without `--compressed` therefore downloads a .gz and says so. That
    # is expected; the API always sends `Accept-Encoding: gzip`.
    location = /oversized.m3u {
        default_type audio/x-mpegurl;
        add_header Content-Encoding gzip always;
        alias /usr/share/nginx/html/oversized.m3u.gz;
    }

    # HTTP 200 with an HTML body: what a mistyped address usually returns.
    # SOURCE_INVALID_FORMAT, not SOURCE_EMPTY — telling the user their playlist
    # is empty when the address is wrong sends them looking in the wrong place.
    location = /not-a-playlist.html {
        default_type text/html;
    }

    # An Xtream panel that refuses the credentials. SOURCE_AUTH_FAILED, which
    # must read as clearly different from "the server did not answer".
    location /xtream-401/ {
        return 401 '{"user_info":{"auth":0}}';
        default_type application/json;
    }

    # A panel that answers something that is not an Xtream payload at all.
    location /xtream-garbage/ {
        return 200 'not json';
        default_type text/plain;
    }

    # A real, decodable HLS stream, WITH the CORS header — the provider that
    # does allow playback in a browser. Six seconds of generated colour bars and
    # a sine tone: no real content, nothing anybody owns (AGENTS.md §1).
    location /stream/ {
        add_header Access-Control-Allow-Origin * always;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        default_type application/octet-stream;
        alias /usr/share/nginx/html/stream/;
    }

    # The same stream WITHOUT the header, which is the majority case in the
    # wild. hls.js cannot touch it, and the player has to say so rather than
    # show a black rectangle. Safari would play it, which is exactly the
    # asymmetry ADR 0007 warns about.
    location /stream-nocors/ {
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        default_type application/octet-stream;
        alias /usr/share/nginx/html/stream/;
    }

    # There is deliberately no "host that never answers" location here. That case
    # is served by 192.0.2.1 — TEST-NET-1, reserved by RFC 5737 and routed
    # nowhere — which is a better reproduction than anything this container could
    # fake, and needs no container at all.

    access_log off;
}
