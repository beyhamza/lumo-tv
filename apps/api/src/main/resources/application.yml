# ==============================================================================
# lumo-api — base configuration.
#
# Every value here is overridable by an environment variable; see
# apps/api/.env.example for what each one means. Secrets have NO default: the
# application refuses to start rather than run on a well-known key.
# ==============================================================================

spring:
  application:
    name: lumo-api

  threads:
    virtual:
      # ADR 0005. The ingestion layer is I/O-bound and written in blocking
      # style; this is what makes that viable. Do not turn it off.
      enabled: true

  datasource:
    # The fallback is the local development database as `docker-compose.yml`
    # publishes it — port 15432 on the host, chosen so several projects can each
    # run a Postgres without arguing over 5432. Every deployed environment sets
    # SPRING_DATASOURCE_URL and never reaches this value.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/lumo}
    username: ${POSTGRES_USER:lumo}
    password: ${POSTGRES_PASSWORD:lumo}
    hikari:
      # Sized to what the DATABASE can serve, never to the number of threads
      # (ADR 0005 §2). Virtual threads do not create database capacity.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      # Fail fast and visibly rather than queue forever behind an exhausted pool.
      #
      # ADR 0005 §2 says to FIX this value and MONITOR it. Ten thousand virtual
      # threads against a pool of twenty means queueing, and an acquisition
      # timeout surfaces far from its cause — as a failed sync or a slow
      # endpoint, not as "the pool is too small". The metric that names it
      # directly is hikaricp.connections.timeout; Micrometer records it
      # automatically from the pool below. Alert on it being non-zero.
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
      # Named so it is identifiable in metrics and thread dumps.
      pool-name: lumo-pool
      register-mbeans: true

  liquibase:
    # ADR 0006: the only non-SQL file in the whole migration set.
    change-log: classpath:db/db.changelog-master.yaml
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

  mvc:
    problemdetails:
      # We produce application/problem+json ourselves, with a stable `code`
      # field the framework knows nothing about. Spring's own RFC 7807 support
      # would answer first for framework-raised exceptions and emit a body
      # without that field, which clients branch on.
      enabled: false

server:
  port: 8080
  error:
    # No stack trace, no message, no framework error page. Errors leave this
    # application through GlobalExceptionHandler and nowhere else.
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
  health:
    mail:
      # Off deliberately. The mail health indicator opens a real SMTP socket, so
      # a mail outage would drag /actuator/health to DOWN and the orchestrator
      # would kill and restart an API that is serving every request perfectly.
      # Mail is not on the critical path here: AccountMailer already swallows
      # delivery failures rather than failing a registration.
      enabled: false

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    tv.lumo: ${LOGGING_LEVEL_TV_LUMO:INFO}
    # These two would print bound SQL parameters, which for `source` means the
    # encrypted credential blob and for `channel` means stream URLs. AGENTS.md §5
    # forbids that at ANY level, so they are pinned here rather than left to a
    # developer's LOGGING_LEVEL_ROOT=DEBUG.
    org.springframework.jdbc.core.JdbcTemplate: INFO
    org.springframework.jdbc.core.StatementCreatorUtils: INFO

lumo:
  jwt:
    # No default. Boot fails here rather than sign tokens with a guessable key.
    secret: ${LUMO_JWT_SECRET}
    access-ttl: ${LUMO_JWT_ACCESS_TTL_MINUTES:15}m
    issuer: https://api.lumo.tv
  refresh:
    ttl: ${LUMO_REFRESH_TTL_DAYS:30}d
  encryption:
    # No default either. Losing this key makes every stored Xtream credential
    # permanently unreadable; leaking it exposes every user's IPTV account.
    master-key: ${LUMO_ENCRYPTION_MASTER_KEY}
  device-code:
    ttl: ${LUMO_DEVICE_CODE_TTL_MINUTES:10}m
    poll-interval: ${LUMO_DEVICE_CODE_POLL_INTERVAL_SECONDS:5}s
  web:
    base-url: ${LUMO_WEB_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${LUMO_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ingest:
    # Explicit backpressure (ADR 0005 §1). Without these, a burst of syncs opens
    # hundreds of connections to one user's panel and gets THAT USER banned.
    max-concurrent-per-host: ${LUMO_INGEST_MAX_CONCURRENT_PER_HOST:4}
    max-concurrent-syncs: ${LUMO_INGEST_MAX_CONCURRENT_SYNCS:50}
    http-timeout: ${LUMO_INGEST_HTTP_TIMEOUT_SECONDS:10}s
    max-payload-mb: ${LUMO_INGEST_MAX_PAYLOAD_MB:200}
    # Whether a source may point inside this server's own network. FALSE, and it
    # stays false anywhere real: without it, POST /sources fetches whatever URL a
    # user supplies from this server's network position — 127.0.0.1, a 10.x
    # neighbour, a cloud metadata endpoint — and reports back what it found.
    # Only the end-to-end stack turns it on, because its test bench is a
    # container on a private network.
    allow-private-hosts: ${LUMO_INGEST_ALLOW_PRIVATE_HOSTS:false}
  rate-limit:
    # Sprint 1: 5 attempts per IP per minute on the sign-in surface (US-01, US-02).
    auth-attempts-per-minute: 5
    device-approve-attempts-per-minute: 5
    # One synchronisation asked for by the user, per source, per interval. The
    # wait that is left goes out as Retry-After with SOURCE_SYNC_RATE_LIMITED.
    # The automatic refresh and a change of credentials do not count.
    manual-sync-interval: ${LUMO_MANUAL_SYNC_INTERVAL:PT5M}
  auto-sync:
    # What Source.auto_sync actually does. Off, and the property is a switch
    # wired to nothing.
    enabled: ${LUMO_AUTO_SYNC_ENABLED:true}
    sweep-interval: ${LUMO_AUTO_SYNC_SWEEP_INTERVAL:PT1H}
    every-hours: ${LUMO_AUTO_SYNC_EVERY_HOURS:12}
    # Per sweep, not per hour. Caps how many of the users' own panels this
    # server may contact at once when nobody asked it to.
    batch-size: ${LUMO_AUTO_SYNC_BATCH_SIZE:25}
  plans:
    # The ONLY place these numbers exist. Never duplicated into a client:
    # entitlements are computed server-side (ADR 0003), and a client that
    # carries its own copy of "FREE = 1 source" is an access right computed
    # client-side. Omit a value to mean unlimited.
    free:
      max-sources: ${LUMO_PLAN_FREE_MAX_SOURCES:1}
      max-devices: ${LUMO_PLAN_FREE_MAX_DEVICES:2}
    # No limits: both properties are absent, which the contract types as
    # "unlimited" rather than "unknown". The empty map is what makes the tier
    # exist while saying nothing about it.
    premium: {}
  billing:
    # No default, and absence is a supported state: the API boots and every
    # other endpoint works without a payment provider. The two /billing/*
    # endpoints answer 503 until both of these are set.
    secret-key: ${STRIPE_SECRET_KEY:}
    price-id: ${STRIPE_PRICE_ID:}
    api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
    # 0 = no trial. This is what puts an entitlement in TRIALING, and it is a
    # server-side number: no client decides how long a trial lasts.
    trial-days: ${STRIPE_TRIAL_DAYS:0}
    # Return targets, built server-side from lumo.web.base-url and NEVER taken
    # from the request. A caller-supplied return URL is an open redirect wearing
    # a billing costume.
    success-path: ${LUMO_BILLING_SUCCESS_PATH:/app/subscription?checkout=success}
    cancel-path: ${LUMO_BILLING_CANCEL_PATH:/app/subscription?checkout=cancelled}
    return-path: ${LUMO_BILLING_RETURN_PATH:/app/subscription}
