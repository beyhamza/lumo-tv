# Local development profile. Never active in production.
logging:
  level:
    tv.lumo: DEBUG
management:
  endpoint:
    health:
      show-details: always

lumo:
  # Nothing here throttles a developer. The block below relaxes a control that
  # ships enabled without weakening the control itself — the numbers are
  # configuration, and production reads the ones in application.yml. Plan limits
  # are deliberately not overridden here any more: the 1000 that used to sit
  # here hid that production capped FREE (BUG-R020-15-01).
  rate-limit:
    # 5 per IP per minute is right for a front door (US-01, US-02). It is wrong
    # for one person signing in twenty times while wiring a screen, from a single
    # address, which is what a developer looks like to a rate limiter.
    auth-attempts-per-minute: 100000
    device-approve-attempts-per-minute: 100000
